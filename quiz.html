<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div class="stage">
  <main class="page art-bg reading-art" data-page="quiz">

    <div class="reading-content">
      <div class="reading-chapter-kicker" data-chapter-number>Chapter 01</div>
      <h1 class="reading-title" data-chapter-title>The Universe</h1>
      <span class="reading-ornament">✦ ✦ ✦</span>
      <h2 class="reading-subtitle" data-chapter-section>1.1 · The First Light</h2>
      <div class="reading-body quiz-body"><!-- quiz items injected by quiz.js --></div>
    </div>

    <aside class="marginalia-note">
      <div class="marginalia-title">Comprehension</div>
      <div class="marginalia-word" style="opacity:0.55; font-size:11px; letter-spacing:0.16em; text-transform:uppercase; font-family:var(--font-display); color:var(--paper-muted);">three questions</div>
    </aside>

    <div class="tap-overlay">
      <div class="tap-overlay-card">Tap to reveal the questions</div>
    </div>

    <nav class="bottom-bar">
      <button type="button" class="nav-link" data-back><span class="g">‹</span>Back</button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-link" data-next>Next<span class="g">›</span></button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-link" onclick="go('select.html')"><span class="g">✦</span>Menu</button>
    </nav>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="data/chapterIllustrations.js"></script>
<script src="data/readingContent.js"></script>
<script src="js/app.js"></script>
<script src="js/reveal.js"></script>
<script src="js/chapterNav.js"></script>
<script src="js/quiz.js"></script>
<script>
  // Set chapter-specific painted background.
  document.addEventListener("DOMContentLoaded", () => {
    const id = qparam("chapter", "universe");
    const bg = getChapterBackground(id, qparam("page", null));
    if (bg) document.querySelector(".page").style.backgroundImage = `url("${bg}")`;
  });
</script>
</body>
</html>
