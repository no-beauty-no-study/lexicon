<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div class="stage">
  <main class="page">
    <div class="page-inner reading-layout">

      <aside class="reading-illus">
        <div class="illus-placeholder">Chapter<br>Illustration</div>
      </aside>

      <section class="reading-main">
        <header class="reading-head">
          <div class="t-eyebrow" data-chapter-number>Chapter 01</div>
          <h1 class="t-chapter" data-chapter-title>The Universe</h1>
          <span class="ornament">✦</span>
          <h2 class="t-section" data-chapter-section>1.1 · The First Light</h2>
          <div class="quiz-eyebrow" style="margin-top:14px;">— Comprehension —</div>
        </header>

        <div class="quiz-body">
          <!-- Quiz items injected by quiz.js -->
        </div>
      </section>

      <aside class="reading-side">
        <div class="reading-side-title">Notes</div>
        <span class="reading-side-rule"></span>
        <div class="reading-side-note is-empty">No marginalia on the quiz page.</div>
      </aside>
    </div>

    <div class="tap-overlay">
      <div class="tap-overlay-card">Tap to reveal the questions</div>
    </div>

    <nav class="nav-bar">
      <button type="button" class="nav-btn" data-back>
        <span class="glyph">‹</span> Back
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" data-next>
        Next <span class="glyph">›</span>
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" onclick="go('select.html')">
        <span class="glyph">✦</span> Menu
      </button>
    </nav>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="data/readingContent.js"></script>
<script src="js/app.js"></script>
<script src="js/reveal.js"></script>
<script src="js/chapterNav.js"></script>
<script src="js/quiz.js"></script>
<script>
  // Wire chapter illustration on quiz too for visual continuity.
  document.addEventListener("DOMContentLoaded", () => {
    const id = qparam("chapter", "universe");
    const c = getChapterOrDefault(id);
    const illus = document.querySelector(".reading-illus");
    if (illus && c.readingBg) {
      illus.style.backgroundImage =
        `linear-gradient(180deg, rgba(244,236,218,0) 0%, rgba(244,236,218,0.18) 100%), url("${c.readingBg}")`;
      illus.style.backgroundSize = "cover";
      illus.style.backgroundPosition = "left center";
      const ph = illus.querySelector(".illus-placeholder");
      if (ph) ph.style.display = "none";
    }
  });
</script>
</body>
</html>
