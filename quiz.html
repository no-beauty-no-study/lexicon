<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/debug.css">
</head>
<body>
<div class="stage">
  <main class="page art-bg reading-art" data-page="quiz">

    <div class="master-frame">

      <div class="ui-zone zone-reading-title is-text" data-zone="quiz title">
        <div class="reading-kicker" data-chapter-number>Chapter 01</div>
        <h1 class="reading-title" data-chapter-title>The Universe</h1>
        <div class="antique-divider"><span class="antique-divider-glyph">✤</span></div>
        <h2 class="reading-subtitle" data-chapter-section>1.1 · The First Light</h2>
      </div>

      <!-- Quiz uses the FULL body width — no marginalia card on the
           right side. Per user: '选择题界面不要那个右边的框'. -->
      <div class="ui-zone zone-quiz-body is-text" data-zone="quiz body">
        <div class="reading-body quiz-body"><!-- quiz items injected by quiz.js --></div>
      </div>

      <nav class="ui-bottom-nav">
        <button type="button" onclick="go('save.html')">Save</button>
        <button type="button" onclick="go('load.html')">Load</button>
        <button type="button" onclick="go('menu.html')">Menu</button>
        <button type="button" data-back>Back</button>
        <button type="button" data-next>Next</button>
      </nav>
    </div>

    <!-- Chapter Complete toast — appears only when all answers are correct.
         ✤ lives in a real element so the inner thin-line ::before and
         broken-corner-tick ::after pseudos can both render. -->
    <div class="chapter-complete-toast" aria-hidden="true">
      <div class="chapter-complete-mark">✤</div>
      <div class="chapter-complete-title">Chapter Complete</div>
      <p class="chapter-complete-subtitle">The next page opens.</p>
    </div>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="data/chapterIllustrations.js"></script>
<script src="data/readingContent.js"></script>
<script src="js/app.js"></script>
<script src="js/reveal.js"></script>
<script src="js/chapterNav.js"></script>
<script src="js/quiz.js"></script>
<script>
  document.addEventListener("DOMContentLoaded", () => {
    const id = qparam("chapter", "universe");
    const bg = getChapterBackground(id, qparam("page", null));
    if (bg) document.querySelector(".page").style.backgroundImage = `url("${bg}")`;
  });
</script>
<script src="js/bgm.js"></script>
<script src="js/viewport.js"></script>
</body>
</html>
