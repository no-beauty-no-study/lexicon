<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Quiz · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  /* Placeholder quiz page. Uses the blank ornate frame artwork. */
  .page.quiz-art {
    background-image: url("assets/bg/ui/frame-blank.jpg");
    background-size: cover;
    background-position: center;
  }
  .page.quiz-art::before, .page.quiz-art::after { display: none; }
  .quiz-stub {
    position: absolute;
    inset: 18% 16% 18% 16%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 18px;
  }
</style>
</head>
<body>
<div class="stage">
  <main class="page quiz-art">
    <div class="quiz-stub">
      <div class="t-eyebrow" data-chapter-number>Chapter 01</div>
      <h1 class="t-chapter" data-chapter-title>The Universe</h1>
      <span class="ornament" style="color: var(--color-gold); letter-spacing: 0.5em;">✦ ✦ ✦</span>
      <p style="font-family:var(--font-cn); color: var(--color-muted); max-width: 520px; line-height: 1.7;">
        Quiz coming soon — each chapter will have a short multiple-choice
        passage based on the words you just read.
      </p>
    </div>

    <nav class="nav-bar">
      <button type="button" class="nav-btn" onclick="history.back()">
        <span class="glyph">‹</span> Back
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" onclick="go('select.html')">
        <span class="glyph">✦</span> Menu
      </button>
    </nav>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="js/app.js"></script>
<script>
  const ch = getChapterOrDefault(qparam("chapter", "universe"));
  document.querySelector("[data-chapter-number]").textContent = "Chapter " + ch.number;
  document.querySelector("[data-chapter-title]").textContent  = ch.title;
</script>
</body>
</html>
