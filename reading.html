<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
</head>
<body>
<div class="stage">
  <main class="page">
    <div class="page-inner reading-layout">

      <aside class="reading-illus">
        <div class="illus-placeholder">Chapter<br>Illustration</div>
      </aside>

      <section class="reading-main">
        <header class="reading-head">
          <div class="t-eyebrow" data-chapter-number>Chapter 01</div>
          <h1 class="t-chapter" data-chapter-title>The Universe</h1>
          <span class="ornament">✦</span>
          <h2 class="t-section" data-chapter-section>1.1 · The First Light</h2>
        </header>

        <article class="reading-body">
          <!-- Reveal blocks injected by reading.js -->
        </article>
      </section>

      <aside class="reading-side">
        <div class="reading-side-title">Marginalia</div>
        <span class="reading-side-rule"></span>
        <div class="side-pinned"></div>
      </aside>
    </div>

    <!-- Tap-to-begin overlay; required to bypass browser autoplay block. -->
    <div class="tap-overlay">
      <div class="tap-overlay-card">Tap the page to begin</div>
    </div>

    <nav class="nav-bar">
      <button type="button" class="nav-btn" onclick="go('notes.html')">
        <span class="glyph">✦</span> Notes
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" data-quiz>
        <span class="glyph">✦</span> Quiz
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" data-back>
        <span class="glyph">‹</span> Back
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" data-next>
        Next <span class="glyph">›</span>
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" onclick="go('select.html')">
        <span class="glyph">✦</span> Menu
      </button>
    </nav>
  </main>
</div>

<script src="data/mockWords.js"></script>
<script src="data/mockChapters.js"></script>
<script src="data/readingContent.js"></script>
<script src="data/wordLibrary.js"></script>
<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/wordCard.js"></script>
<script src="js/reveal.js"></script>
<script src="js/chapterNav.js"></script>
<script src="js/reading.js"></script>
</body>
</html>
