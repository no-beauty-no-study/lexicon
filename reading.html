<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/debug.css">
</head>
<body>
<div class="stage">
  <main class="page art-bg reading-art" data-page="reading">

    <!-- MASTER FRAME — the single legal layout box, defined by the 4
         painted blue corner medallions. Every interactive zone below
         is its child and uses MASTER-FRAME-RELATIVE percentages, not
         page-relative ones. -->
    <div class="master-frame">

      <!-- ZONE 1 — title strip. Right-aligned, ends at the same right
           edge as the body and the marginalia card so the page has a
           single vertical right edge. -->
      <div class="ui-zone zone-reading-title is-text" data-zone="reading title">
        <div class="reading-kicker" data-chapter-number>Chapter 01</div>
        <h1 class="reading-title" data-chapter-title>The Universe</h1>
        <span class="reading-ornament">✤ ✤ ✤</span>
        <h2 class="reading-subtitle" data-chapter-section>1.1 · The First Light</h2>
      </div>

      <!-- ZONE 2 — body parchment. Reveal blocks flow inside; right edge
           leaves a stable gutter for the marginalia card; body never
           overlaps the card. -->
      <div class="ui-zone zone-reading-body is-text" data-zone="reading body">
        <article class="reading-body"><!-- reveal blocks injected by reading.js --></article>
      </div>

      <!-- ZONE 3 — marginalia. Fixed card with header / headword /
           collocations / FOLD / SAVE. Longer entry text opens in a
           drawer; this card stays compact and left-aligned. -->
      <div class="ui-zone zone-marginalia" data-zone="marginalia">
        <aside class="marginalia-card">
          <div class="marginalia-card-header">MARGINALIA</div>
          <div class="marginalia-card-body">
            <div class="marginalia-card-empty">Tap a word</div>
            <div class="marginalia-card-content" hidden>
              <h3 class="marginalia-headword"></h3>
              <ul class="marginalia-collocations"></ul>
            </div>
          </div>
          <div class="marginalia-card-actions">
            <button type="button" class="marginalia-btn" data-action="fold" disabled>
              <span class="marginalia-btn-glyph">✤</span>FOLD
            </button>
            <button type="button" class="marginalia-btn" data-action="save">
              <span class="marginalia-btn-glyph">✤</span>SAVE
            </button>
          </div>
        </aside>
      </div>

      <!-- Bottom nav — positions via --nav-* CSS vars (see pages.css),
           which are now MASTER-FRAME-RELATIVE. Container IS the zone. -->
      <nav class="ui-bottom-nav">
        <button type="button" onclick="go('save.html')">Save</button>
        <button type="button" onclick="go('load.html')">Load</button>
        <button type="button" onclick="go('select.html')">Menu</button>
        <button type="button" data-back>Back</button>
        <button type="button" data-next>Next</button>
      </nav>
    </div>

    <!-- Tap-to-begin overlay sits outside the master frame so it can
         fully cover the page for the first-tap fade-in. -->
    <div class="tap-overlay">
      <div class="tap-overlay-card">Tap the page to begin</div>
    </div>
  </main>
</div>

<script src="data/mockWords.js"></script>
<script src="data/wordLibrary.js"></script>
<script src="data/wordIndex.js"></script>
<script src="data/mockChapters.js"></script>
<script src="data/chapterIllustrations.js"></script>
<script src="data/readingContent.js"></script>
<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/wordCard.js"></script>
<script src="js/reveal.js"></script>
<script src="js/chapterNav.js"></script>
<script src="js/reading.js"></script>
</body>
</html>
