<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select a Mode · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/debug.css">
<style>
  .page.select-art {
    background-image: url("assets/bg/ui/select-mode.jpg");
  }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg select-art">

    <!-- ZONES are positioned absolutely; content flows inside. -->
    <div class="ui-zone zone-select-story-title is-text" data-zone="story title">
      <h2 class="select-card-title">Story</h2>
      <p class="select-card-subtitle">Read the tale.</p>
    </div>
    <div class="ui-zone zone-select-notes-title is-text" data-zone="notes title">
      <h2 class="select-card-title">Notes</h2>
      <p class="select-card-subtitle">Keep saved words.</p>
    </div>
    <div class="ui-zone zone-select-garden-title is-text" data-zone="garden title">
      <h2 class="select-card-title">Word Garden</h2>
      <p class="select-card-subtitle">Search every word.</p>
    </div>

    <div class="ui-zone zone-select-story-hit is-hit" data-zone="story hotspot">
      <button type="button" onclick="go('chapters.html')"     aria-label="Story"></button>
    </div>
    <div class="ui-zone zone-select-notes-hit is-hit" data-zone="notes hotspot">
      <button type="button" onclick="go('notes.html')"        aria-label="Notes"></button>
    </div>
    <div class="ui-zone zone-select-garden-hit is-hit" data-zone="garden hotspot">
      <button type="button" onclick="go('word-garden.html')"  aria-label="Word Garden"></button>
    </div>

    <div class="ui-zone zone-select-bottom-nav is-button" data-zone="menu / load">
      <nav class="page-bottom-nav is-two">
        <button type="button" onclick="go('index.html')">Menu</button>
        <button type="button" onclick="go('load.html')">Load</button>
      </nav>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
