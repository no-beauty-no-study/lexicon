<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Select a Mode · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/debug.css">
<style>
  .page.select-art {
    background-image: url("assets/bg/ui/select-mode.jpg");
  }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg select-art">

    <div class="master-frame">

      <!-- Title plates: upper-half cream strip inside each arch -->
      <div class="ui-zone zone-select-story-title is-text select-title-text" data-zone="story title">
        <h2 class="select-card-title">Story</h2>
        <p class="select-card-subtitle">Read the tale.</p>
      </div>
      <div class="ui-zone zone-select-notes-title is-text select-title-text" data-zone="notes title">
        <h2 class="select-card-title">Notes</h2>
        <p class="select-card-subtitle">Keep saved words.</p>
      </div>
      <div class="ui-zone zone-select-garden-title is-text select-title-text" data-zone="garden title">
        <h2 class="select-card-title">Word Garden</h2>
        <p class="select-card-subtitle">Search every word.</p>
      </div>

      <!-- Full-arch hotspots cover the entire arch and sit above the
           title plates so the cursor on any part of an arch reads as
           a click on that arch. -->
      <button type="button" class="select-hotspot ui-zone zone-select-story-hit"
              data-go="chapters.html"     aria-label="Story"></button>
      <button type="button" class="select-hotspot ui-zone zone-select-notes-hit"
              data-go="notes.html"        aria-label="Notes"></button>
      <button type="button" class="select-hotspot ui-zone zone-select-garden-hit"
              data-go="word-garden.html"  aria-label="Word Garden"></button>

      <nav class="ui-bottom-nav is-two">
        <button type="button" onclick="go('index.html')">Menu</button>
        <button type="button" onclick="go('load.html')">Load</button>
      </nav>
    </div>
  </main>
</div>

<script src="js/app.js"></script>
<script>
  // Click feedback for the 3 arch buttons:
  //  1. Add .is-pressed for the gold pulse animation.
  //  2. Play a brief golden sine arpeggio (Web Audio, no asset).
  //  3. Navigate after the pulse + chime starts so the user gets
  //     the feedback even on a fast tap.
  function playSelectChime() {
    try {
      const Ctx = window.AudioContext || window.webkitAudioContext;
      if (!Ctx) return;
      const ctx = new Ctx();
      const notes = [659.25, 880.00, 1318.51];   // E5 A5 E6
      const now = ctx.currentTime;
      notes.forEach((freq, i) => {
        const o = ctx.createOscillator();
        const g = ctx.createGain();
        o.type = "sine";
        o.frequency.value = freq;
        const t0 = now + i * 0.10;
        g.gain.setValueAtTime(0, t0);
        g.gain.linearRampToValueAtTime(0.16, t0 + 0.018);
        g.gain.exponentialRampToValueAtTime(0.0008, t0 + 0.65);
        o.connect(g).connect(ctx.destination);
        o.start(t0);
        o.stop(t0 + 0.7);
      });
      setTimeout(() => { try { ctx.close(); } catch(_) {} }, 1300);
    } catch (_) { /* silent */ }
  }
  document.querySelectorAll(".select-hotspot").forEach(el => {
    el.addEventListener("click", e => {
      el.classList.remove("is-pressed");
      void el.offsetWidth;                       // restart the animation
      el.classList.add("is-pressed");
      playSelectChime();
      const dest = el.dataset.go;
      setTimeout(() => window.go(dest), 380);
    });
  });
</script>
</body>
</html>
