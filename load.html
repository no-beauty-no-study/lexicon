<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Load · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  .page.load-art {
    background-image: url("assets/bg/ui/page-blank.jpg");
  }
  .save-banner-title {
    position: absolute;
    left: 28%; top: 5.5%;
    width: 44%; height: 6%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    font-family: var(--font-display);
    font-size: 28px;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--accent-blue);
    z-index: 5;
  }
  .save-slot-grid {
    position: absolute;
    left: 16%; top: 18%;
    width: 68%; height: 67%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 1fr;
    gap: 18px 28px;
    z-index: 4;
  }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg load-art theme-load" data-page="load">
    <h1 class="save-banner-title">Load</h1>
    <div class="save-slot-grid slot-grid" data-mode="load"></div>
    <nav class="ui-bottom-nav is-two">
      <button type="button" onclick="go('select.html')">
        <span class="nav-glyph">‹</span>Back
      </button>
      <button type="button" onclick="go('menu.html')">
        <span class="nav-glyph">✤</span>Menu
      </button>
    </nav>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/saveLoad.js"></script>
<script src="js/bgm.js"></script>
<script src="js/viewport.js"></script>
</body>
</html>
