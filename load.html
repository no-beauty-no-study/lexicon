<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Load · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  .page.load-art {
    background-image: url("assets/bg/ui/page-blank.jpg");
  }
  /* Same banner-title + slot-grid + hit-zones as save.html, just
     a different accent colour (blue instead of wine). */
  .save-banner-title {
    position: absolute;
    left: 30%; top: 5.5%;
    width: 40%; height: 6%;
    display: flex;
    align-items: center;
    justify-content: center;
    pointer-events: none;
    font-family: var(--font-display);
    font-size: 26px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--accent-blue);
    z-index: 5;
  }
  .save-slot-grid {
    position: absolute;
    left: 18%; top: 18%;
    width: 64%; height: 65%;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 1fr;
    gap: 16px 24px;
    z-index: 4;
  }
  .save-hit-back, .save-hit-menu {
    position: absolute;
    width: 12%;  height: 5%;
    top: 88%;
    background: transparent;
    border: 0;
    cursor: pointer;
    z-index: 6;
  }
  .save-hit-back { left: 32%; }
  .save-hit-menu { left: 56%; }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg load-art theme-load" data-page="load">
    <h1 class="save-banner-title">Load</h1>
    <div class="save-slot-grid slot-grid" data-mode="load"></div>
    <button type="button" class="save-hit-back" onclick="go('select.html')" aria-label="Back"></button>
    <button type="button" class="save-hit-menu" onclick="go('menu.html')"   aria-label="Menu"></button>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/saveLoad.js"></script>
<script src="js/bgm.js"></script>
<script src="js/viewport.js"></script>
</body>
</html>
