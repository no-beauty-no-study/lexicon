<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table of Contents · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  /* The TOC artwork already paints all 10 chapter cards and the title.
     We overlay 10 invisible hit-zones that match their positions, plus
     the BACK / MENU footer bar. */
  .page.toc-art {
    background-image: url("assets/bg/ui/chapters.jpg");
    background-size: cover;
    background-position: center;
  }
  .page.toc-art::before, .page.toc-art::after { display: none; }

  .toc-hits {
    position: absolute;
    /* Two-column grid of 5 rows in the centre. */
    left: 18%; right: 16%; top: 16%; bottom: 16%;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: repeat(5, 1fr);
    column-gap: 3.5%;
    row-gap: 1%;
  }
  .toc-hit {
    cursor: pointer;
    border-radius: 5px;
    transition: background 200ms ease, box-shadow 200ms ease;
  }
  .toc-hit:hover {
    background: rgba(154, 131, 88, 0.10);
    box-shadow: 0 0 0 1px rgba(154, 131, 88, 0.40) inset;
  }
  .toc-hit[aria-label] { /* keep them findable for keyboard / dev */ }
</style>
</head>
<body>
<div class="stage">
  <main class="page toc-art">
    <div class="toc-hits" id="tocHits"></div>

    <nav class="nav-bar">
      <button type="button" class="nav-btn" onclick="go('select.html')">
        <span class="glyph">‹</span> Back
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" onclick="go('index.html')">
        <span class="glyph">✦</span> Menu
      </button>
    </nav>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="js/app.js"></script>
<script>
  // Layout in TOC artwork: rows 01,06 / 02,07 / 03,08 / 04,09 / 05,10
  const ORDER = [
    "universe", "south-america",
    "earth-history", "asia",
    "africa", "oceans",
    "antarctica", "europe",
    "australia-pacific", "north-america",
  ];
  const wrap = document.getElementById("tocHits");
  wrap.innerHTML = ORDER.map(id => {
    const c = getChapter(id);
    return `<a class="toc-hit" aria-label="${c.number} ${c.title}"
                href="reading.html?chapter=${c.id}"></a>`;
  }).join("");
</script>
</body>
</html>
