<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table of Contents · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/debug.css">
<style>
  .page.chapters-art {
    background-image: url("assets/bg/ui/chapters.jpg");
  }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg chapters-art" data-page="chapters">

    <!-- All UI lives inside the master frame so the 10 chapter cards
         line up with the painted slots. The 10 zone coordinates are
         the user's hand-measured page-relative values converted to
         master-frame-relative; see debug.css. -->
    <div class="master-frame">

      <!-- Each .zone-toc-NN holds: a TEXT block (number + title +
           tagline) above an OPEN CHAPTER plaque (antique-button).
           Both sit inside the painted card on the right side of each
           chapter row. The painted card on the LEFT holds the
           illustration — we don't touch that. -->
      <div class="ui-zone zone-toc-01 toc-card" data-zone="ch 01"></div>
      <div class="ui-zone zone-toc-02 toc-card" data-zone="ch 02"></div>
      <div class="ui-zone zone-toc-03 toc-card" data-zone="ch 03"></div>
      <div class="ui-zone zone-toc-04 toc-card" data-zone="ch 04"></div>
      <div class="ui-zone zone-toc-05 toc-card" data-zone="ch 05"></div>
      <div class="ui-zone zone-toc-06 toc-card" data-zone="ch 06"></div>
      <div class="ui-zone zone-toc-07 toc-card" data-zone="ch 07"></div>
      <div class="ui-zone zone-toc-08 toc-card" data-zone="ch 08"></div>
      <div class="ui-zone zone-toc-09 toc-card" data-zone="ch 09"></div>
      <div class="ui-zone zone-toc-10 toc-card" data-zone="ch 10"></div>

      <!-- Bottom nav — Back + Menu. Uses the shared --nav-* vars below. -->
      <nav class="ui-bottom-nav">
        <button type="button" onclick="go('select.html')">
          <span class="nav-glyph">‹</span>Back
        </button>
        <button type="button" onclick="go('index.html')">
          <span class="nav-glyph">✤</span>Menu
        </button>
      </nav>
    </div>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="js/app.js"></script>
<script>
  // Render the text + OPEN CHAPTER plaque into each .zone-toc-NN.
  // The number on each card matches the painted "01"–"10" plate
  // on the left side of the same row, so the user always sees the
  // same number twice (painted on the illustration, inked on our card).
  document.addEventListener("DOMContentLoaded", () => {
    CHAPTERS.forEach((c, i) => {
      const slot = document.querySelector(".zone-toc-" + c.number);
      if (!slot) return;
      slot.innerHTML = `
        <div class="toc-card-text">
          <h3 class="toc-card-title">${c.title}</h3>
          <p  class="toc-card-tagline">${c.tagline || ""}</p>
        </div>
        <div class="toc-card-action">
          <button type="button" class="antique-button toc-open-btn"
                  data-go="reading.html?chapter=${encodeURIComponent(c.id)}&section=${encodeURIComponent(c.firstSection || "1.1")}">
            <span class="antique-button-corner tl"></span>
            <span class="antique-button-corner tr"></span>
            <span class="antique-button-corner bl"></span>
            <span class="antique-button-corner br"></span>
            <span class="antique-button-label">Open Chapter</span>
          </button>
        </div>
      `;
    });
    document.querySelectorAll(".toc-open-btn").forEach(btn => {
      btn.addEventListener("click", () => window.go(btn.dataset.go));
    });
  });
</script>
</body>
</html>
