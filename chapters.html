<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table of Contents · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  /* CSS-rendered TOC. We drop the painted chapters.jpg in favour of an
     interactive grid of .ornate-panel cards, so descriptions and the
     OPEN CHAPTER button are real (clickable + content-driven). */
  .toc-page { padding: 44px 60px 110px; display: flex; flex-direction: column; }
  .toc-header { text-align: center; margin-bottom: 26px; }
  .toc-header .toc-eyebrow {
    font-family: var(--font-display);
    font-size: 13px;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--color-gold);
  }
  .toc-header h1 {
    font-family: var(--font-display);
    font-size: 44px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    font-weight: 400;
    color: #2f3c4a;
    margin: 8px 0 6px;
  }
  .toc-header .toc-sub {
    font-family: var(--font-display);
    font-size: 16px;
    letter-spacing: 0.16em;
    color: var(--color-subtitle);
    font-style: italic;
  }
  .toc-header .toc-rule {
    display: block;
    width: 120px; height: 1px;
    background: var(--paper-frame);
    margin: 14px auto 0;
    opacity: 0.6;
  }

  .toc-grid {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-auto-rows: 1fr;
    gap: 18px 30px;
    overflow-y: auto;
    padding: 4px 2px;
  }

  /* Each card is itself an ornate-panel; inner is a 2-column layout. */
  .toc-card {
    display: grid;
    grid-template-columns: 86px 1fr auto;
    gap: 18px;
    align-items: center;
    padding: 16px 22px;
    min-height: 120px;
  }
  .toc-num {
    font-family: var(--font-display);
    font-size: 28px;
    font-weight: 400;
    letter-spacing: 0.06em;
    color: #7c6a4a;
    text-align: center;
    border: 1px solid rgba(167, 141, 91, 0.55);
    border-radius: 50%;
    width: 64px; height: 64px;
    line-height: 62px;
    margin: 0 auto;
    background: rgba(255, 251, 240, 0.45);
  }
  .toc-body { min-width: 0; }
  .toc-title {
    font-family: var(--font-display);
    font-size: 20px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--color-title);
    margin: 0;
    font-weight: 400;
  }
  .toc-tagline {
    font-size: 14px;
    line-height: 1.5;
    letter-spacing: 0.02em;
    color: var(--color-muted);
    margin: 6px 0 0;
    max-width: 38ch;
  }
  .toc-open {
    align-self: center;
    /* ornate-panel.is-small base; only set typography here. */
    font-family: var(--font-display);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--color-button-ink);
    padding: 9px 16px;
    min-width: 130px;
    text-align: center;
    white-space: nowrap;
  }
  .toc-open .arrow { margin-left: 6px; color: var(--color-gold); }

  /* On small heights, the grid scrolls — the card padding stays. */
</style>
</head>
<body>
<div class="stage">
  <main class="page">
    <div class="page-inner toc-page">

      <header class="toc-header">
        <div class="toc-eyebrow">✦ ✦ ✦</div>
        <h1>Table of Contents</h1>
        <div class="toc-sub">World History Reading Path</div>
        <span class="toc-rule"></span>
      </header>

      <div class="toc-grid" id="tocGrid"></div>
    </div>

    <nav class="nav-bar">
      <button type="button" class="nav-btn" onclick="go('select.html')">
        <span class="glyph">‹</span> Back
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" onclick="go('index.html')">
        <span class="glyph">✦</span> Menu
      </button>
    </nav>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="js/app.js"></script>
<script>
  const grid = document.getElementById("tocGrid");

  // Render: left column = 01..05, right column = 06..10.
  // CSS grid is row-major, so we interleave to get the right layout.
  function rowAt(i) {
    const a = CHAPTERS[i];           // 0..4
    const b = CHAPTERS[i + 5];       // 5..9
    return [a, b];
  }

  const html = [];
  for (let i = 0; i < 5; i++) {
    const [a, b] = rowAt(i);
    for (const c of [a, b]) {
      html.push(cardHtml(c));
    }
  }
  grid.innerHTML = html.join("");

  function cardHtml(c) {
    return `
      <article class="toc-card ornate-panel">
        <div class="toc-num">${c.number}</div>
        <div class="toc-body">
          <h2 class="toc-title">${c.title}</h2>
          <p class="toc-tagline">${escapeHtml(c.tagline)}</p>
        </div>
        <button type="button"
                class="toc-open ornate-panel is-small is-clickable"
                onclick="go('reading.html?chapter=${c.id}&section=${encodeURIComponent(c.firstSection)}')"
                aria-label="Open Chapter ${c.number} ${c.title}">
          Open Chapter <span class="arrow">›</span>
        </button>
      </article>
    `;
  }

  function escapeHtml(s) {
    return String(s || "")
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
</script>
</body>
</html>
