<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Table of Contents · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/debug.css">
<style>
  .page.chapters-art {
    background-image: url("assets/bg/ui/chapters.jpg");
  }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg chapters-art" data-page="chapters">

    <!-- All UI lives inside the master frame so the 10 chapter cards
         line up with the painted slots. The 10 zone coordinates are
         the user's hand-measured page-relative values converted to
         master-frame-relative; see debug.css. -->
    <div class="master-frame">

      <!-- TEXT zones — one per chapter. Each just holds the chapter
           title + italic tagline; the button is a SEPARATE zone below. -->
      <div class="ui-zone zone-toc-01 toc-card" data-zone="ch 01"></div>
      <div class="ui-zone zone-toc-02 toc-card" data-zone="ch 02"></div>
      <div class="ui-zone zone-toc-03 toc-card" data-zone="ch 03"></div>
      <div class="ui-zone zone-toc-04 toc-card" data-zone="ch 04"></div>
      <div class="ui-zone zone-toc-05 toc-card" data-zone="ch 05"></div>
      <div class="ui-zone zone-toc-06 toc-card" data-zone="ch 06"></div>
      <div class="ui-zone zone-toc-07 toc-card" data-zone="ch 07"></div>
      <div class="ui-zone zone-toc-08 toc-card" data-zone="ch 08"></div>
      <div class="ui-zone zone-toc-09 toc-card" data-zone="ch 09"></div>
      <div class="ui-zone zone-toc-10 toc-card" data-zone="ch 10"></div>

      <!-- OPEN CHAPTER BUTTON zones. Coords come straight from the
           user's hand-measured red lines; all 10 buttons share the
           same column width + height so the page reads as one tidy
           grid of identical plaques. -->
      <div class="ui-zone zone-toc-btn-01 toc-btn-zone" data-zone="btn 01"></div>
      <div class="ui-zone zone-toc-btn-02 toc-btn-zone" data-zone="btn 02"></div>
      <div class="ui-zone zone-toc-btn-03 toc-btn-zone" data-zone="btn 03"></div>
      <div class="ui-zone zone-toc-btn-04 toc-btn-zone" data-zone="btn 04"></div>
      <div class="ui-zone zone-toc-btn-05 toc-btn-zone" data-zone="btn 05"></div>
      <div class="ui-zone zone-toc-btn-06 toc-btn-zone" data-zone="btn 06"></div>
      <div class="ui-zone zone-toc-btn-07 toc-btn-zone" data-zone="btn 07"></div>
      <div class="ui-zone zone-toc-btn-08 toc-btn-zone" data-zone="btn 08"></div>
      <div class="ui-zone zone-toc-btn-09 toc-btn-zone" data-zone="btn 09"></div>
      <div class="ui-zone zone-toc-btn-10 toc-btn-zone" data-zone="btn 10"></div>

      <nav class="ui-bottom-nav">
        <button type="button" onclick="go('select.html')">
          <span class="nav-glyph">‹</span>Back
        </button>
        <button type="button" onclick="go('index.html')">
          <span class="nav-glyph">✤</span>Menu
        </button>
      </nav>
    </div>
  </main>
</div>

<script src="data/mockChapters.js"></script>
<script src="js/app.js"></script>
<script>
  // Render text into each .zone-toc-NN; render the plaque into each
  // .zone-toc-btn-NN. Two zones per chapter so the button's exact
  // pixel position can never be pushed by a longer tagline.
  document.addEventListener("DOMContentLoaded", () => {
    CHAPTERS.forEach((c) => {
      const text = document.querySelector(".zone-toc-" + c.number);
      const btn  = document.querySelector(".zone-toc-btn-" + c.number);
      if (text) text.innerHTML = `
        <div class="toc-card-text">
          <h3 class="toc-card-title">${c.title}</h3>
          <p  class="toc-card-tagline">${c.tagline || ""}</p>
        </div>`;
      if (btn) btn.innerHTML = `
        <button type="button" class="antique-button toc-open-btn"
                data-go="reading.html?chapter=${encodeURIComponent(c.id)}&section=${encodeURIComponent(c.firstSection || "1.1")}">
          <span class="antique-button-corner tl"></span>
          <span class="antique-button-corner tr"></span>
          <span class="antique-button-corner bl"></span>
          <span class="antique-button-corner br"></span>
          <span class="antique-button-label">Open Chapter</span>
        </button>`;
    });
    document.querySelectorAll(".toc-open-btn").forEach(btn => {
      btn.addEventListener("click", () => window.go(btn.dataset.go));
    });
  });
</script>
</body>
</html>
