name: Deploy to GitHub Pages

on:
  # Auto-deploy only from main. PR branches don't have permission to
  # deploy to the github-pages environment (default protection rule).
  # To preview a feature branch, run this workflow manually from the
  # Actions tab via workflow_dispatch, after adding the branch to the
  # environment's "Deployment branches" list.
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deploy
        uses: actions/deploy-pages@v4
