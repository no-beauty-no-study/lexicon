<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Princess Lexicon · Main Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  .page.home {
    background-image: url("assets/bg/ui/main-menu.jpg");
  }
  /* User-given layout proportions across the page (1 : 2 : 3.5 : 2 : 1):
     ────────────────────────────────────────────────────────────────
     10.5%  margin │ 21%  button │ 37%  gap │ 21%  button │ 10.5%  margin
     ────────────────────────────────────────────────────────────────
     Buttons sit at vertical centre (princess's dress level), use the
     uploaded ENTER CHAPTER image as their FULL visual (text baked in
     to the image, no overlay). Click feedback = scale-bounce, the
     button stays fully visible the whole time. */
  .menu-btn {
    position: absolute;
    top: 50%;
    width: 21%;
    aspect-ratio: 601 / 645;
    background-image: url("assets/bg/ui/menu-button-enter.png");
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-color: transparent;
    border: 0;
    cursor: pointer;
    transform: translateY(-50%) scale(1);
    transform-origin: center center;
    transition: transform 220ms cubic-bezier(0.34, 1.56, 0.64, 1);
    z-index: 8;
  }
  .menu-btn:active   { transform: translateY(-50%) scale(0.92); }
  .menu-btn:focus    { outline: none; }
  .menu-btn.left  { left:  10.5%; }
  .menu-btn.right { right: 10.5%; }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg home">
    <!-- Two big plaques flanking the central princess. Both use the
         same painted ENTER CHAPTER image. Left = resume the user's
         last reading position; Right = chapter index. -->
    <button type="button" class="menu-btn left"  data-action="resume"></button>
    <button type="button" class="menu-btn right" data-action="chapters"></button>
  </main>
</div>
<script src="js/app.js"></script>
<script>
  // Resume = jump straight back to the most-recently-read chapter
  // (set by reading.js on every page visit). Falls back to the
  // chapter index if no reading history yet — that's also what
  // Select's Story arch will do (user: '点 Story 是继续上一章 不是 index').
  function resumeOrPick() {
    let last = null;
    try { last = JSON.parse(localStorage.getItem("tpl.lastRead") || "null"); }
    catch (_) {}
    if (last && last.chapter) {
      window.go(`reading.html?chapter=${encodeURIComponent(last.chapter)}`
              + `&section=${encodeURIComponent(last.section || "1.1")}`);
    } else {
      window.go("chapters.html");
    }
  }
  document.querySelectorAll(".menu-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const a = btn.dataset.action;
      if (a === "resume")   resumeOrPick();
      else                  window.go("chapters.html");
    });
  });
</script>
<script src="js/bgm.js"></script>
<script src="js/viewport.js"></script>
</body>
</html>
