<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Princess Lexicon · Main Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  .page.home {
    background-image: url("assets/bg/ui/main-menu.jpg");
  }
  /* User-given layout proportions across the page (1 : 2 : 3.5 : 2 : 1):
     ────────────────────────────────────────────────────────────────
     10.5%  margin │ 21%  button │ 37%  gap │ 21%  button │ 10.5%  margin
     ────────────────────────────────────────────────────────────────
     Buttons sit at vertical centre (princess's dress level), use the
     uploaded ENTER CHAPTER image as their FULL visual (text baked in
     to the image, no overlay). Click feedback = scale-bounce, the
     button stays fully visible the whole time. */
  /* The OUTER button only handles layout (vertical centering). The
     scale-on-click animates an INNER span instead, so the layout
     translateY(-50%) is never interpolated against the click scale
     — that was the cause of the 'button becomes half image and
     gets bigger' bug on press. */
  .menu-btn {
    position: absolute;
    top: 50%;
    width: 21%;
    aspect-ratio: 601 / 645;
    transform: translateY(-50%);
    background: transparent;
    border: 0;
    padding: 0;
    cursor: pointer;
    z-index: 8;
  }
  .menu-btn:focus { outline: none; }
  .menu-btn.left  { left:  10.5%; }
  .menu-btn.right { right: 10.5%; }

  .menu-btn-inner {
    display: block;
    width: 100%;
    height: 100%;
    background-size: 100% 100%;
    background-repeat: no-repeat;
    background-color: transparent;
    transform-origin: center center;
    transition: transform 180ms cubic-bezier(0.2, 0.8, 0.4, 1.2),
                filter    180ms ease-out;
  }
  .menu-btn:active .menu-btn-inner {
    transform: scale(0.93);
    filter: brightness(1.06);
  }
  .menu-btn.left  .menu-btn-inner {
    background-image: url("assets/bg/ui/menu-button-start.png");
  }
  .menu-btn.right .menu-btn-inner {
    background-image: url("assets/bg/ui/menu-button-enter.png");
  }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg home">
    <!-- Two big plaques flanking the central princess. Both use the
         same painted ENTER CHAPTER image. Left = resume the user's
         last reading position; Right = chapter index. -->
    <button type="button" class="menu-btn left"  data-action="resume">
      <span class="menu-btn-inner"></span>
    </button>
    <button type="button" class="menu-btn right" data-action="chapters">
      <span class="menu-btn-inner"></span>
    </button>
  </main>
</div>
<script src="js/app.js"></script>
<script>
  // LEFT  = 'START READING' — the continuous-flow path. Takes the
  //         user to Select → Story → resume from tpl.lastRead.
  //         All reading from this path UPDATES tpl.lastRead so
  //         the next 'continue' lands on the page just read.
  // RIGHT = 'ENTER CHAPTER' — the browse / explore path. Goes to
  //         the chapter index with ?browse=1; chapters → reading
  //         carries that flag forward; reading.js, when it sees
  //         browse=1, SKIPS updating tpl.lastRead. So poking around
  //         from the index doesn't overwrite the user's main
  //         continue-game position (user spec: 'index 不计入继续
  //         游戏的过程 / 所以要分俩按钮').
  document.querySelectorAll(".menu-btn").forEach(btn => {
    btn.addEventListener("click", () => {
      const a = btn.dataset.action;
      if (a === "resume")   window.go("select.html");
      else                  window.go("chapters.html?browse=1");
    });
  });
</script>
<script src="js/bgm.js"></script>
<script src="js/viewport.js"></script>
</body>
</html>
