<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Princess Lexicon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<link rel="stylesheet" href="css/debug.css">
<style>
  /* Splash uses the user-supplied PNG original directly so any future
     re-upload of the same UUID-named file flows through with no
     re-encode step. (The earlier splash.jpg is a transcode of the
     same image; either works visually.) */
  .page.splash    { background-image: url("assets/bg/ui/C1F92DD5-F950-4011-81E4-DFD527CC8FBD.png");
                    background-size: 108% 108%;       /* room for Ken-Burns drift */
                    background-position: 50% 50%;
                    cursor: pointer;
                    animation: splash-breathe 22s ease-in-out infinite alternate; }
  .page.splash::before, .page.splash::after { display: none; }
  .page.splash.is-leaving {
    transition: opacity 580ms ease-out, filter 580ms ease-out;
    opacity: 0; filter: brightness(1.18);
  }
  .splash-hit     { position: absolute; inset: 0; }
  /* Subtle Ken-Burns / parallax-style background drift — pure
     background-position so it doesn't fight the stage scale. */
  @keyframes splash-breathe {
    0%   { background-position: 49% 51%; }
    100% { background-position: 51% 49%; }
  }

  /* Drifting "stardust" — each particle is randomised at create
     time (size / drift / speed / delay) so the layer never reads
     as identical loops. Set in JS via CSS variables. */
  .splash-sparkle {
    position: absolute;
    left: var(--x);
    bottom: -6%;
    width:  var(--sz);
    height: var(--sz);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,245,215,0.95) 0%,
      rgba(255,225,170,0.45) 45%,
      transparent 75%);
    box-shadow: 0 0 10px 2px rgba(255,230,180,0.5);
    pointer-events: none;
    opacity: 0;
    z-index: 6;
    will-change: transform, opacity;
    animation: splash-sparkle-rise var(--d) linear infinite;
    animation-delay: var(--delay);
  }
  @keyframes splash-sparkle-rise {
    0%   { transform: translate(0, 0)                              scale(0.45); opacity: 0; }
    8%   { opacity: 0.85; }
    50%  { transform: translate(calc(var(--drift) * 0.5), -55vh)   scale(1.1);  opacity: 0.95; }
    92%  { opacity: 0.65; }
    100% { transform: translate(var(--drift), -118vh)              scale(0.4);  opacity: 0; }
  }

  /* Tap-to-begin water ripple — warm-gold central burst plus
     three thin gold rings expanding outward from the actual tap
     coordinates. JS sets left/top per element and staggers the
     ring delays via animation-delay. */
  .splash-ripple-center,
  .splash-ripple-ring {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 50;
    will-change: transform, opacity;
  }
  .splash-ripple-center {
    width: 14px; height: 14px;
    background: radial-gradient(circle,
      rgba(255,250,225,1)   0%,
      rgba(255,230,180,0.7) 35%,
      rgba(255,210,140,0.2) 60%,
      transparent 80%);
    box-shadow: 0 0 36px 12px rgba(255,228,178,0.7);
    animation: splash-ripple-center-burst 760ms cubic-bezier(0.22,0.61,0.36,1) forwards;
  }
  @keyframes splash-ripple-center-burst {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0; }
    18%  { transform: translate(-50%, -50%) scale(3);   opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(60);  opacity: 0; }
  }
  .splash-ripple-ring {
    width: 22px; height: 22px;
    border: 2px solid rgba(255,232,184,0.85);
    background: transparent;
    box-shadow: 0 0 14px 1px rgba(255,225,170,0.4);
    animation: splash-ripple-ring-expand 900ms cubic-bezier(0.22,0.61,0.36,1) forwards;
  }
  @keyframes splash-ripple-ring-expand {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(120); opacity: 0; }
  }

  .page.home         { background-image: url("assets/bg/ui/main-menu.jpg"); }
  .page.select-art   { background-image: url("assets/bg/ui/select-mode.jpg"); }
  .page.chapters-art { background-image: url("assets/bg/ui/chapters.jpg"); }
  .page.wg-art       { background-image: url("assets/bg/ui/word-garden.jpg"); }
  .page.save-art     { background-image: url("assets/bg/ui/page-blank.jpg"); }
  .page.load-art     { background-image: url("assets/bg/ui/page-blank.jpg"); }
  .page.notes-art    { background-image: url("assets/bg/ui/notes.jpg");
                       background-size: cover; background-position: center; }
  .page.notes-art::before, .page.notes-art::after { display: none; }

  .menu-btn {
    position: absolute; top: 50%; width: 21%;
    aspect-ratio: 601 / 645;
    transform: translateY(-50%);
    background: transparent; border: 0; padding: 0;
    cursor: pointer; z-index: 8;
  }
  .menu-btn:focus { outline: none; }
  .menu-btn.left  { left: 10.5%; }
  .menu-btn.right { right: 10.5%; }
  .menu-btn-inner {
    display: block; width: 100%; height: 100%;
    background-size: 100% 100%; background-repeat: no-repeat;
    background-color: transparent; transform-origin: center;
    transition: transform 180ms cubic-bezier(0.2,0.8,0.4,1.2),
                filter    180ms ease-out;
    /* Gentle, alternating float so the cover doesn't feel static.
       Pauses on :active so the press scale doesn't fight the keyframe. */
    animation: menu-hero-breathe 4.6s ease-in-out infinite alternate;
  }
  .menu-btn.right .menu-btn-inner { animation-delay: -2.3s; }
  @keyframes menu-hero-breathe {
    0%   { transform: translateY(0)    scale(1);     filter: brightness(1); }
    100% { transform: translateY(-7px) scale(1.012); filter: brightness(1.05); }
  }
  .menu-btn:active .menu-btn-inner {
    animation-play-state: paused;
    transform: scale(0.93); filter: brightness(1.06);
  }
  .menu-btn.left  .menu-btn-inner { background-image: url("assets/bg/ui/menu-button-start.png"); }
  .menu-btn.right .menu-btn-inner { background-image: url("assets/bg/ui/menu-button-enter.png"); }

  /* =========================================================
     COVER LAYER SYSTEM
     Two flat layers stacked over the painted .page.home bg:
       - .cover-bg-layer  : every animated overlay (curtains, stars,
                            water, wand, flowers). pointer-events: none
                            so no overlay can swallow a button tap.
       - .cover-ui-layer  : buttons + future interactive chrome.
                            pointer-events: auto. Sits ABOVE the bg
                            layer so even an opaque overlay can't hide
                            a button.
     ========================================================= */
  .cover-bg-layer {
    position: absolute; inset: 0;
    z-index: 1;
    pointer-events: none;
    /* Clip every sway overlay (which has full-page bg + mask) to the
       cover bounds so a mistuned mask can never leak past the edge. */
    overflow: hidden;
  }
  .cover-ui-layer {
    position: absolute; inset: 0;
    z-index: 10;
    pointer-events: auto;
  }

  /* ============================
     A. STAR SPARKLES (twinkle)
     ============================ */
  .menu-stars { position: absolute; pointer-events: none; z-index: 4; }
  .stars-title  { left: 35.7%; top:  0%;   width: 28.6%; height: 14.3%; }
  .stars-circle { left: 31.4%; top: 23.8%; width: 37.5%; height: 36.7%; }
  .menu-star {
    position: absolute;
    left: var(--x); top: var(--y);
    width:  var(--sz);
    height: var(--sz);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,250,225,1) 0%,
      rgba(255,235,180,0.55) 50%,
      transparent 80%);
    box-shadow: 0 0 4px 1px rgba(255,235,180,0.45);
    opacity: 0.25;
    pointer-events: none;
    animation: menu-star-twinkle var(--d) ease-in-out infinite alternate;
    animation-delay: var(--delay);
    will-change: opacity, transform;
  }
  @keyframes menu-star-twinkle {
    0%   { opacity: 0.18; transform: scale(0.92); }
    100% { opacity: 0.62; transform: scale(1.10); }
  }

  /* ============================
     B. WAND TIP GLOW
     B1 center ~(742, 455) of 1400×1050 → (53.0%, 43.3%)
     ============================ */
  .glow-wand {
    position: absolute;
    left: 53.0%; top: 43.3%;
    width: 3.6%; height: 4.8%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    background: radial-gradient(circle,
      rgba(255,245,200,0.85) 0%,
      rgba(255,225,170,0.5)  35%,
      rgba(255,210,140,0.18) 60%,
      transparent 82%);
    box-shadow: 0 0 28px 8px rgba(255,230,180,0.50);
    mix-blend-mode: screen;
    z-index: 5;
    animation: glow-wand-breathe 2.8s ease-in-out infinite alternate;
  }
  @keyframes glow-wand-breathe {
    0%   { opacity: 0.35; transform: translate(-50%, -50%) scale(1);    }
    100% { opacity: 0.85; transform: translate(-50%, -50%) scale(1.18); }
  }

  /* ============================
     G. LAKE SHIMMER
     G1 30.4–69.7% × 64.8–80.5%
     Diagonal gold band travels left→right via background-position;
     mix-blend-mode: screen brightens the water without darkening it.
     ============================ */
  .shimmer-water {
    position: absolute;
    left: 30.4%; top: 64.8%;
    width: 39.3%; height: 15.7%;
    background: linear-gradient(98deg,
      transparent 0%,
      transparent 32%,
      rgba(255,245,210,0.15) 41%,
      rgba(255,255,230,0.32) 50%,
      rgba(255,245,210,0.15) 59%,
      transparent 68%,
      transparent 100%);
    background-size: 250% 100%;
    background-repeat: no-repeat;
    mix-blend-mode: screen;
    pointer-events: none;
    z-index: 3;
    animation: shimmer-water-slide 13s linear infinite;
  }
  @keyframes shimmer-water-slide {
    0%   { background-position: -100% 50%; }
    100% { background-position:  200% 50%; }
  }

  /* ============================
     C / D / E. SWAY OVERLAYS
     Each overlay div is a full-page bg copy aligned with the base
     image (same background-size: cover / position: 50% 50%), masked
     to reveal ONLY its target region with feathered edges, then
     transform-animated as a single rigid body. Hard edges of the
     mask move WITH the content so the sway can't reveal seams.
     ============================ */
  .menu-sway {
    position: absolute;
    inset: 0;
    background-image: url("assets/bg/ui/main-menu.jpg");
    background-size: cover;
    background-position: 50% 50%;
    pointer-events: none;
    z-index: 2;
    will-change: transform;
  }
  /* C1 — left curtain.  Region: 0–20.4% × 9–96.7%. Soft right edge. */
  .sway-curtain-left {
    -webkit-mask-image:
      linear-gradient(to right, #000 0%, #000 17%, transparent 23%),
      linear-gradient(to bottom, transparent 7%, #000 11%, #000 95%, transparent 99%);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(to right, #000 0%, #000 17%, transparent 23%),
      linear-gradient(to bottom, transparent 7%, #000 11%, #000 95%, transparent 99%);
            mask-composite: intersect;
    transform-origin: 15% 10%;
    animation: sway-curtain-l 7.2s ease-in-out infinite alternate;
  }
  @keyframes sway-curtain-l {
    0%   { transform: rotate(-0.28deg) translateX(-1px); }
    100% { transform: rotate( 0.28deg) translateX( 1px); }
  }
  /* C2 — right curtain.  79.6–100% × 9–96.7%. delay desync = -1.8s. */
  .sway-curtain-right {
    -webkit-mask-image:
      linear-gradient(to right, transparent 77%, #000 83%, #000 100%),
      linear-gradient(to bottom, transparent 7%, #000 11%, #000 95%, transparent 99%);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(to right, transparent 77%, #000 83%, #000 100%),
      linear-gradient(to bottom, transparent 7%, #000 11%, #000 95%, transparent 99%);
            mask-composite: intersect;
    transform-origin: 85% 10%;
    animation: sway-curtain-r 8.1s ease-in-out -1.8s infinite alternate;
  }
  @keyframes sway-curtain-r {
    0%   { transform: rotate(-0.24deg) translateX(-1px); }
    100% { transform: rotate( 0.24deg) translateX( 1px); }
  }
  /* D1 — left blue banner ribbon.  11.1–29.3% × 17.6–40.9%. */
  .sway-banner-left {
    -webkit-mask-image:
      linear-gradient(to right, transparent 9%, #000 14%, #000 26%, transparent 32%),
      linear-gradient(to bottom, transparent 15%, #000 19%, #000 39%, transparent 44%);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(to right, transparent 9%, #000 14%, #000 26%, transparent 32%),
      linear-gradient(to bottom, transparent 15%, #000 19%, #000 39%, transparent 44%);
            mask-composite: intersect;
    transform-origin: 25% 15%;
    animation: sway-banner 6.4s ease-in-out infinite alternate;
  }
  /* D2 — right blue banner ribbon, desynced. */
  .sway-banner-right {
    -webkit-mask-image:
      linear-gradient(to right, transparent 68%, #000 73%, #000 86%, transparent 92%),
      linear-gradient(to bottom, transparent 15%, #000 19%, #000 39%, transparent 44%);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(to right, transparent 68%, #000 73%, #000 86%, transparent 92%),
      linear-gradient(to bottom, transparent 15%, #000 19%, #000 39%, transparent 44%);
            mask-composite: intersect;
    transform-origin: 75% 15%;
    animation: sway-banner 7.0s ease-in-out -2.2s infinite alternate;
  }
  @keyframes sway-banner {
    0%   { transform: translateY(-1px) rotate(-0.35deg); }
    100% { transform: translateY( 1px) rotate( 0.35deg); }
  }
  /* E1 — bottom-left flower cluster. 0–33.6% × 75.2–100%. */
  .sway-flowers-left {
    -webkit-mask-image:
      linear-gradient(to right, #000 0%, #000 28%, transparent 36%),
      linear-gradient(to bottom, transparent 73%, #000 77%, #000 100%);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(to right, #000 0%, #000 28%, transparent 36%),
      linear-gradient(to bottom, transparent 73%, #000 77%, #000 100%);
            mask-composite: intersect;
    transform-origin: 18% 100%;
    animation: sway-flowers 5.8s ease-in-out infinite alternate;
  }
  /* E2 — bottom-right flower cluster. 66.4–100% × 75.2–100%. */
  .sway-flowers-right {
    -webkit-mask-image:
      linear-gradient(to right, transparent 64%, #000 72%, #000 100%),
      linear-gradient(to bottom, transparent 73%, #000 77%, #000 100%);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(to right, transparent 64%, #000 72%, #000 100%),
      linear-gradient(to bottom, transparent 73%, #000 77%, #000 100%);
            mask-composite: intersect;
    transform-origin: 82% 100%;
    animation: sway-flowers 6.6s ease-in-out -1.7s infinite alternate;
  }
  @keyframes sway-flowers {
    0%   { transform: rotate(-0.5deg) translateY( 0); }
    100% { transform: rotate( 0.5deg) translateY(-1px); }
  }
  /* E3 — bottom-center vines.  27.5–73.6% × 81.9–100%. Lower amp. */
  .sway-vines-center {
    -webkit-mask-image:
      linear-gradient(to right, transparent 25%, #000 31%, #000 69%, transparent 75%),
      linear-gradient(to bottom, transparent 79%, #000 83%, #000 100%);
    -webkit-mask-composite: source-in;
            mask-image:
      linear-gradient(to right, transparent 25%, #000 31%, #000 69%, transparent 75%),
      linear-gradient(to bottom, transparent 79%, #000 83%, #000 100%);
            mask-composite: intersect;
    transform-origin: 50% 100%;
    animation: sway-vines 8.5s ease-in-out infinite alternate;
  }
  @keyframes sway-vines {
    0%   { transform: rotate(-0.2deg) translateY( 0); }
    100% { transform: rotate( 0.2deg) translateY(-1px); }
  }

  /* ============================
     MENU BUTTON RIPPLE
     Antique gold ripple on press. ::after expands from the actual
     tap coordinates (CSS vars --ripple-x / --ripple-y set in JS).
     Note: no `overflow: hidden` on .menu-btn — that would clip the
     -7px translateY of the breathing animation and shave the top
     of the painted button. The ripple's max scale is kept modest
     (scale 9) so any bleed past the button edge stays subtle over
     the painted scene.
     ============================ */
  .menu-btn::after {
    content: "";
    position: absolute;
    left: var(--ripple-x, 50%);
    top:  var(--ripple-y, 50%);
    width:  14px;
    height: 14px;
    border-radius: 50%;
    pointer-events: none;
    background: radial-gradient(circle,
      rgba(255,241,178,0.70) 0%,
      rgba(215,180,105,0.32) 38%,
      rgba(215,180,105,0)    70%);
    transform: translate(-50%, -50%) scale(0);
    opacity: 0;
    z-index: 12;
  }
  .menu-btn.is-clicking::after {
    animation: menu-btn-ripple 560ms ease-out;
  }
  @keyframes menu-btn-ripple {
    0%   { transform: translate(-50%, -50%) scale(0.2); opacity: 0.78; }
    100% { transform: translate(-50%, -50%) scale(9);   opacity: 0; }
  }

  /* ============================
     REDUCED MOTION
     Disable every cover-bg animation so motion-sensitive users see
     a still painting. Button feedback (ripple, press) is preserved
     since those are user-initiated, not idle.
     ============================ */
  @media (prefers-reduced-motion: reduce) {
    .menu-sway, .menu-star, .glow-wand, .shimmer-water,
    .menu-btn-inner {
      animation: none !important;
    }
  }

  /* Global "voice" link — fixed-position so it sits above .stage
     and stays visible across all views. Hidden on splash (where it
     would compete with the full-screen tap target) and on #voices
     itself (redundant). The current view is set on body.dataset
     by app.js render(). */
  .global-voice-link {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: 0;
    margin: 10px 14px;
    padding: 8px 12px;
    background: rgba(20, 14, 8, 0.42);
    border: 1px solid rgba(220, 195, 145, 0.45);
    border-radius: 14px;
    font-family: var(--font-display);
    font-size: 11px; letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(245, 225, 180, 0.92);
    text-shadow: 0 1px 2px rgba(0,0,0,0.45);
    cursor: pointer; z-index: 1000;
  }
  .global-voice-link:active { color: rgba(255, 240, 200, 1); background: rgba(40, 28, 16, 0.62); }
  body[data-current-view="splash"] .global-voice-link,
  body[data-current-view="voices"] .global-voice-link { display: none; }

  /* Voices view — a simple scrollable list of installed system
     voices, each row testable + selectable. Painted on the same
     blank-page parchment background as save/load for cohesion. */
  .page.voices-art   { background-image: url("assets/bg/ui/page-blank.jpg"); }
  .voices-title {
    position: absolute; left: 28%; top: 5.5%;
    width: 44%; height: 6%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    font-family: var(--font-display);
    font-size: 28px; letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--accent-wine, #6e2a2a);
    z-index: 5;
  }
  .voices-help {
    position: absolute; left: 16%; top: 12%;
    width: 68%;
    font-family: var(--font-text, serif);
    font-size: 14px; line-height: 1.5;
    color: rgba(75, 62, 42, 0.86);
    pointer-events: none;
    z-index: 5;
  }
  .voices-help em { font-style: italic; color: rgba(75, 62, 42, 1); }
  .voices-list {
    position: absolute; left: 16%; top: 24%;
    width: 68%; height: 61%;
    margin: 0; padding: 0 6px;
    list-style: none; overflow-y: auto; z-index: 4;
    /* master-frame is pointer-events:none so its children inherit
       none — without re-enabling here, the list could not be tapped
       OR scrolled (every touch went straight through to the page
       behind it). The flick-scrolling property gives iOS momentum
       scroll inside the scaled stage. */
    pointer-events: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .voice-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(184,158,111,0.35);
    font-family: var(--font-text, serif);
    color: rgba(75, 62, 42, 0.92);
  }
  .voice-row.is-current { background: rgba(244, 222, 170, 0.45); }
  .voice-name { font-size: 17px; }
  .voice-meta {
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(126, 105, 74, 0.85);
  }
  .voice-row button {
    border: 1px solid rgba(126, 105, 74, 0.55);
    background: transparent;
    padding: 10px 16px;     /* bigger tap target */
    min-height: 36px;
    font-family: var(--font-display); font-size: 12px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(75, 62, 42, 0.92);
    cursor: pointer;
  }
  .voice-row button:active { background: rgba(126, 105, 74, 0.18); }

  .notes-layer {
    position: absolute; inset: 18% 18% 14% 18%;
    display: grid; grid-template-columns: 300px 1fr; gap: 24px;
  }
  .notes-layer .split-left,
  .notes-layer .split-right {
    background: rgba(244,236,218,0.62);
    border: 1px solid rgba(184,158,111,0.45);
    border-radius: 4px; padding: 14px 14px 10px;
    min-height: 0; display: flex; flex-direction: column;
  }
  .notes-layer .split-right { padding: 18px 22px; overflow-y: auto; }
  .notes-layer .word-list   { flex: 1; overflow-y: auto; }

  .save-banner-title {
    position: absolute; left: 28%; top: 5.5%;
    width: 44%; height: 6%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    font-family: var(--font-display);
    font-size: 28px; letter-spacing: 0.20em;
    text-transform: uppercase;
    z-index: 5;
  }
  .theme-save .save-banner-title { color: var(--accent-wine); }
  .theme-load .save-banner-title { color: var(--accent-blue); }
  .save-slot-grid {
    position: absolute; left: 16%; top: 18%;
    width: 68%; height: 67%;
    display: grid; grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 1fr; gap: 18px 28px; z-index: 4;
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<!-- Global "voice" link — visible top-right on every view EXCEPT
     splash (it would compete with the splash-hit) and #voices
     itself. Always available so the user can hop to the voice
     picker mid-reading without having to back out to the menu. -->
<button type="button" class="global-voice-link" data-go="#voices"
        aria-label="Choose voice">voice</button>


<template id="view-splash">

  </main>
</template>

<template id="view-menu">
  <main class="page art-bg home" data-page="menu">
    <!-- ==================== Cover BG animation layer ====================
         z-index 1, pointer-events: none. Holds every per-region overlay
         that animates the painted scene (curtains, banners, flowers,
         vines, water, stars, wand). The painted face / hands / castle /
         title scroll have NO overlay on top — they stay perfectly still.
         Coords + mask regions are tuned to the 1400×1050 source PNG.   -->
    <div class="cover-bg-layer" aria-hidden="true">
      <!-- C1 left curtain · C2 right curtain -->
      <div class="menu-sway sway-curtain-left"></div>
      <div class="menu-sway sway-curtain-right"></div>
      <!-- D1 / D2 blue ribbon banners flanking the title scroll -->
      <div class="menu-sway sway-banner-left"></div>
      <div class="menu-sway sway-banner-right"></div>
      <!-- E1 / E2 / E3 bottom flower beds + center vines -->
      <div class="menu-sway sway-flowers-left"></div>
      <div class="menu-sway sway-flowers-right"></div>
      <div class="menu-sway sway-vines-center"></div>
      <!-- A1 / A2 star sparkle layers (stars spawned by menu.init) -->
      <div class="menu-stars stars-title"></div>
      <div class="menu-stars stars-circle"></div>
      <!-- B1 wand-tip glow -->
      <div class="menu-glow glow-wand"></div>
      <!-- G1 lake shimmer -->
      <div class="menu-shimmer shimmer-water"></div>
    </div>
    <!-- ==================== Cover UI / interaction layer ===================
         z-index 10, pointer-events: auto. Buttons live here; the bg layer
         above this comment cannot block their taps. -->
    <div class="cover-ui-layer">
      <button type="button" class="menu-btn left"  data-action="resume">
        <span class="menu-btn-inner"></span>
      </button>
      <button type="button" class="menu-btn right" data-action="enter-chapters">
        <span class="menu-btn-inner"></span>
      </button>
    </div>
  </main>
</template>

<template id="view-reading">

    <div class="master-frame">
      <div class="ui-zone zone-reading-title is-text" data-zone="reading title">
        <div class="reading-kicker" data-chapter-number>Chapter 01</div>

        <aside class="marginalia-card">
          <div class="marginalia-card-body">

              <div class="word-card-empty">Tap a word</div>

            <button type="button" class="marginalia-btn" data-action="fold" disabled>
              <span class="marginalia-btn-glyph">✤</span>FOLD
            </button>
            <!-- Locket — runs the persistent count of folded words.

                 number grow. -->
            <div class="marginalia-locket" aria-label="Folded words">
              <span class="marginalia-locket-glyph">❦</span>
