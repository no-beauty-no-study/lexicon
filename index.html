<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Princess Lexicon · Main Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  /* main-menu.jpg is the full painted UI. Per user feedback the
     two buttons were too far apart ('感觉好像那个 眼睛外斜的唐氏脸')
     — moved to the middle-lower band of the artwork, centred and
     closer together. */
  .page.home {
    background-image: url("assets/bg/ui/main-menu.jpg");
  }
  .home-btn-row {
    position: absolute;
    left: 50%;
    bottom: 6%;
    transform: translateX(-50%);
    display: flex;
    gap: 4%;
    z-index: 8;
  }
  .home-btn-row .antique-button {
    min-width: 0;
    width: 150px;
    height: 30px;
  }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg home">
    <!-- Two entry plaques. Painted bg holds the title; we only
         overlay these plaques (centred low, close together). -->
    <div class="home-btn-row">
      <button type="button" class="antique-button" onclick="go('select.html')">
        <span class="antique-button-label">Enter</span>
      </button>
      <button type="button" class="antique-button" onclick="go('chapters.html')">
        <span class="antique-button-label">Chapters</span>
      </button>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/bgm.js"></script>
<script src="js/viewport.js"></script>
</body>
</html>
