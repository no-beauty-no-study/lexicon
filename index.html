<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Princess Lexicon · Main Menu</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  /* main-menu.jpg is the full painted UI. Buttons sit in the empty
     strip between the oval portrait and the floral bottom border. */
  .page.home {
    background-image: url("assets/bg/ui/main-menu.jpg");
  }
  .home-action-row {
    position: absolute;
    left: 28.5%; top: 78%;
    width: 43%; height: 6.4%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5%;
    z-index: 8;
  }
  .home-action-row .antique-label {
    width: 47%;
    height: 100%;
    min-width: 0;
    min-height: 0;
    font-size: 15px;
  }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg home">
    <!-- Title (banner + "Main Menu" + oval portrait) is painted into the
         artwork. We only overlay the two entry plaques. -->
    <div class="home-action-row">
      <button type="button" class="antique-label" onclick="go('select.html')">Enter the Book</button>
      <button type="button" class="antique-label" onclick="go('chapters.html')">Chapter Index</button>
    </div>
  </main>
</div>
<script src="js/app.js"></script>
</body>
</html>
