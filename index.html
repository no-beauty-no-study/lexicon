<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Princess Lexicon · Main Menu</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  /* main-menu.jpg is the full painted UI. Two buttons flank the
     central portrait, one in each side band, per user spec
     "两边中间" — vertically centred on the empty left/right strips. */
  .page.home {
    background-image: url("assets/bg/ui/main-menu.jpg");
  }
  .home-left-btn,
  .home-right-btn {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 14%;
    height: 5.5%;
    z-index: 8;
  }
  .home-left-btn  { left:  5%; }
  .home-right-btn { right: 5%; }
</style>
</head>
<body>
<div class="stage">
  <main class="page art-bg home">
    <!-- Two entry plaques in the empty side strips. Painted bg holds
         the title; we only overlay these plaques. -->
    <button type="button" class="antique-button home-left-btn" onclick="go('select.html')">
      <span class="antique-button-corner tl"></span>
      <span class="antique-button-corner tr"></span>
      <span class="antique-button-corner bl"></span>
      <span class="antique-button-corner br"></span>
      <span class="antique-button-label">Enter</span>
    </button>
    <button type="button" class="antique-button home-right-btn" onclick="go('chapters.html')">
      <span class="antique-button-corner tl"></span>
      <span class="antique-button-corner tr"></span>
      <span class="antique-button-corner bl"></span>
      <span class="antique-button-corner br"></span>
      <span class="antique-button-label">Chapters</span>
    </button>
  </main>
</div>
<script src="js/app.js"></script>
<script src="js/viewport.js"></script>
</body>
</html>
