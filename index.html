<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>The Princess Lexicon</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="css/base.css?v=20260615f">
<link rel="stylesheet" href="css/layout.css?v=20260615f">
<link rel="stylesheet" href="css/components.css?v=20260615f">
<link rel="stylesheet" href="css/pages.css?v=20260615f">

<style>
  /* Splash uses the user-supplied PNG original directly so any future
     re-upload of the same UUID-named file flows through with no
     re-encode step. (The earlier splash.jpg is a transcode of the
     same image; either works visually.) */
  .page.splash    { background-image: url("assets/bg/ui/C1F92DD5-F950-4011-81E4-DFD527CC8FBD.png");
                    background-size: 100% 100%;       /* exact fit — no zoom/crop */
                    background-position: 50% 50%;
                    background-repeat: no-repeat;
                    cursor: pointer; }
  .page.splash::before, .page.splash::after { display: none; }
  .page.splash.is-leaving {
    transition: opacity 580ms ease-out, filter 580ms ease-out;
    opacity: 0; filter: brightness(1.18);
  }
  .splash-hit     { position: absolute; inset: 0; }
  /* Subtle Ken-Burns / parallax-style background drift — pure
     background-position so it doesn't fight the stage scale. */
  @keyframes splash-breathe {
    0%   { background-position: 49% 51%; }
    100% { background-position: 51% 49%; }
  }

  /* Drifting "stardust" — each particle is randomised at create
     time (size / drift / speed / delay) so the layer never reads
     as identical loops. Set in JS via CSS variables. */
  .splash-sparkle {
    position: absolute;
    left: var(--x);
    bottom: -6%;
    width:  var(--sz);
    height: var(--sz);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,245,215,0.95) 0%,
      rgba(255,225,170,0.45) 45%,
      transparent 75%);
    box-shadow: 0 0 10px 2px rgba(255,230,180,0.5);
    pointer-events: none;
    opacity: 0;
    z-index: 6;
    will-change: transform, opacity;
    animation: splash-sparkle-rise var(--d) linear infinite;
    animation-delay: var(--delay);
  }
  @keyframes splash-sparkle-rise {
    0%   { transform: translate(0, 0)                              scale(0.45); opacity: 0; }
    8%   { opacity: 0.85; }
    50%  { transform: translate(calc(var(--drift) * 0.5), -55vh)   scale(1.1);  opacity: 0.95; }
    92%  { opacity: 0.65; }
    100% { transform: translate(var(--drift), -118vh)              scale(0.4);  opacity: 0; }
  }

  /* Tap-to-begin water ripple — warm-gold central burst plus
     three thin gold rings expanding outward from the actual tap
     coordinates. JS sets left/top per element and staggers the
     ring delays via animation-delay. */
  .splash-ripple-center,
  .splash-ripple-ring {
    position: absolute;
    pointer-events: none;
    border-radius: 50%;
    transform: translate(-50%, -50%) scale(0);
    z-index: 50;
    will-change: transform, opacity;
  }
  .splash-ripple-center {
    width: 14px; height: 14px;
    background: radial-gradient(circle,
      rgba(255,250,225,1)   0%,
      rgba(255,230,180,0.7) 35%,
      rgba(255,210,140,0.2) 60%,
      transparent 80%);
    box-shadow: 0 0 36px 12px rgba(255,228,178,0.7);
    animation: splash-ripple-center-burst 760ms cubic-bezier(0.22,0.61,0.36,1) forwards;
  }
  @keyframes splash-ripple-center-burst {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0; }
    18%  { transform: translate(-50%, -50%) scale(3);   opacity: 1; }
    100% { transform: translate(-50%, -50%) scale(60);  opacity: 0; }
  }
  .splash-ripple-ring {
    width: 22px; height: 22px;
    border: 2px solid rgba(255,232,184,0.85);
    background: transparent;
    box-shadow: 0 0 14px 1px rgba(255,225,170,0.4);
    animation: splash-ripple-ring-expand 900ms cubic-bezier(0.22,0.61,0.36,1) forwards;
  }
  @keyframes splash-ripple-ring-expand {
    0%   { transform: translate(-50%, -50%) scale(0);   opacity: 0; }
    10%  { opacity: 0.9; }
    100% { transform: translate(-50%, -50%) scale(120); opacity: 0; }
  }

  .page.home         { background-image: url("assets/bg/ui/main-menu.jpg"); }
  .page.select-art   { background-image: url("assets/bg/ui/select-mode.jpg"); }
  .page.chapters-art { background-image: url("assets/bg/ui/chapters.jpg"); }
  .page.wg-art       { background-image: url("assets/bg/ui/word-garden.jpg"); }
  .page.save-art     { background-image: url("assets/bg/ui/saveload.jpg"); }
  .page.load-art     { background-image: url("assets/bg/ui/saveload.jpg"); }
  .page.follow-art   { background-image: url("assets/bg/ui/follow-station.png"); }
  .page.vn-art       { background-image: url("assets/bg/ui/page-blank.jpg"); }
  .page.notes-art    { background-image: url("assets/bg/ui/notes.jpg");
                       background-size: cover; background-position: center; }
  .page.notes-art::before, .page.notes-art::after { display: none; }

  /* FIVE framed-plaque buttons (transparent cut-outs) laid in a downward
     arc — a 半圆/倒三角 ∪ that frames the princess: the outer pair ride high,
     the inner pair drop, and Follow Paths sits at the low centre. All five
     touch into one connected curve (not a flat row). */
  .menu-btn {
    position: absolute; width: 13.5%;
    aspect-ratio: 549 / 596;
    transform: translate(-50%, -50%);
    background: transparent; border: 0; padding: 0;
    cursor: pointer; z-index: 8;
  }
  .menu-btn:focus { outline: none; }
  .menu-btn.left   { left: 17.5%; top: 47.5%; }  /* Start Reading  (arc top, unchanged) */
  .menu-btn.quiz   { left: 33.5%; top: 66%;   }  /* Begin Trial    (arc mid, lower)     */
  .menu-btn.paths  { left: 50%;   top: 77%;   }  /* Follow Paths   (arc point, lowest)  */
  .menu-btn.recall { left: 66.5%; top: 66%;   }  /* Words Recall   (arc mid, lower)     */
  .menu-btn.right  { left: 82.5%; top: 47.5%; }  /* Enter Chapter  (arc top, unchanged) */
  .menu-btn .menu-btn-inner {
    background-size: contain; background-position: center; background-repeat: no-repeat;
    filter: drop-shadow(0 5px 13px rgba(40, 28, 12, 0.34));
  }
  .menu-btn.left  .menu-btn-inner { background-image: url("assets/bg/ui/menu-start.png"); }
  .menu-btn.right .menu-btn-inner { background-image: url("assets/bg/ui/menu-enter.png"); }
  .menu-btn.quiz   .menu-btn-inner { background-image: url("assets/bg/ui/menu-trial.png"); }
  .menu-btn.recall .menu-btn-inner { background-image: url("assets/bg/ui/menu-recall.png"); }
  .menu-btn.paths  .menu-btn-inner { background-image: url("assets/bg/ui/menu-paths.png"); }
  /* NOTE: this used to be `overflow: hidden` to contain an old diagonal
     gleam-sweep pseudo-element — but that sweep no longer exists, and the
     clip was instead cropping the hover lift and the click-glow drop-shadow
     into a hard rectangle ("框"). Worse, the top pair fills its box edge-to-
     edge (background-size:100% 100%) so its lift/glow was clipped to nothing,
     while the bottom pair (background-size:contain) had inner margin to show
     it — hence "only the bottom two had the effect". Let it overflow. */
  .menu-btn { overflow: visible; }
  .menu-btn-inner {
    display: block; width: 100%; height: 100%;
    background-size: contain; background-position: center; background-repeat: no-repeat;
    background-color: transparent; transform-origin: center;
    transition: transform 180ms cubic-bezier(0.2,0.8,0.4,1.2),
                filter    180ms ease-out;
    animation: menu-hero-breathe 4.6s ease-in-out infinite alternate;
  }
  .menu-btn.right .menu-btn-inner { animation-delay: -2.3s; }
  @keyframes menu-hero-breathe {
    0%   { transform: translateY(0)    scale(1);     filter: brightness(1); }
    100% { transform: translateY(-3px) scale(1.012); filter: brightness(1.05); }
  }
  /* HOVER — the painted button lifts + warms. Must REMOVE the breathe
     animation (not merely pause it): a paused animation still applies its own
     transform/filter and would override the hover lift, which is why the top
     (animated) pair never reacted while the bottom pair did. */
  .menu-btn:hover .menu-btn-inner {
    animation: none;
    transform: translateY(-6px) scale(1.05);
    filter: brightness(1.12) drop-shadow(0 12px 22px rgba(40, 28, 12, 0.34));
  }
  .menu-btn.quiz:hover .menu-btn-inner,
  .menu-btn.recall:hover .menu-btn-inner,
  .menu-btn.paths:hover .menu-btn-inner {
    filter: brightness(1.12) drop-shadow(0 12px 22px rgba(40, 28, 12, 0.42));
  }
  /* Layer 2 — press sink: REAL "I'm being pressed" feel.
     translateY(5px) is much more visible than the prior 2px;
     scale 0.93 fully smacks the button into the painting; the
     brightness(0.85) + contrast(1.08) sells "depressed". 60ms
     transition so the press is snappy, not floaty. */
  .menu-btn:active .menu-btn-inner {
    animation: none;
    transition: transform 60ms ease-out, filter 60ms ease-out;
    transform: translateY(5px) scale(0.93);
    filter: brightness(0.85) contrast(1.08);
  }

  /* Layer 4 — badge "blessing" at the top-centre of the painted
     button (crown for left, book for right). The two screen-spanning
     gleam / unlock layers are gone — the user reported them reading
     as "two flashes across the screen with no transition", which is
     the opposite of "opening a magic book". The badge is now bigger
     (38% w), longer (820ms), and emits a small ring + a sparkle puff
     around itself so the moment of activation is unmistakable. */
  .menu-btn-badge {
    position: absolute;
    top: 9%; left: 50%;
    width: 38%; aspect-ratio: 1;
    transform: translate(-50%, 0) scale(0.7);
    border-radius: 50%;
    pointer-events: none;
    z-index: 12;
    opacity: 0;
    background: radial-gradient(circle,
      rgba(255,246,200,0.78) 0%,
      rgba(255,228,170,0.42) 40%,
      rgba(255,210,140,0.10) 65%,
      transparent 82%);
    box-shadow: 0 0 28px 8px rgba(255,225,170,0.5);
    mix-blend-mode: screen;
  }
  .menu-btn.is-activated .menu-btn-badge {
    animation: menu-badge-blessing 820ms cubic-bezier(0.22, 1, 0.36, 1);
  }
  @keyframes menu-badge-blessing {
    0%   { opacity: 0;    transform: translate(-50%, 0) scale(0.6);  }
    18%  { opacity: 1;    transform: translate(-50%, 0) scale(1.05); }
    45%  { opacity: 0.95; transform: translate(-50%, 0) scale(1.42); }
    100% { opacity: 0;    transform: translate(-50%, 0) scale(1.05); }
  }
  /* Expanding gold ring traced AROUND the badge — gives a "lock
     opening / blessing accepted" beat instead of just a glow blob. */
  .menu-btn-badge::after {
    content: "";
    position: absolute;
    inset: 0;
    border: 2px solid rgba(255,232,184,0);
    border-radius: 50%;
    box-shadow: 0 0 0 rgba(220,190,120,0);
  }
  .menu-btn.is-activated .menu-btn-badge::after {
    animation: menu-badge-ring 720ms ease-out;
  }
  @keyframes menu-badge-ring {
    0%   { inset: 25%;  border-color: rgba(255,232,184,0);    box-shadow: 0 0 0 rgba(220,190,120,0); }
    45%  { inset:  0%;  border-color: rgba(255,232,184,0.85); box-shadow: 0 0 22px rgba(255,225,170,0.55); }
    100% { inset: -22%; border-color: rgba(255,232,184,0);    box-shadow: 0 0 0 rgba(220,190,120,0); }
  }

  /* =========================================================
     COVER LAYER SYSTEM
     Two flat layers stacked over the painted .page.home bg:
       - .cover-bg-layer  : every animated overlay (curtains, stars,
                            water, wand, flowers). pointer-events: none
                            so no overlay can swallow a button tap.
       - .cover-ui-layer  : buttons + future interactive chrome.
                            pointer-events: auto. Sits ABOVE the bg
                            layer so even an opaque overlay can't hide
                            a button.
     ========================================================= */
  .cover-bg-layer {
    position: absolute; inset: 0;
    z-index: 1;
    pointer-events: none;
    /* Clip every sway overlay (which has full-page bg + mask) to the
       cover bounds so a mistuned mask can never leak past the edge. */
    overflow: hidden;
  }
  .cover-ui-layer {
    position: absolute; inset: 0;
    z-index: 10;
    pointer-events: auto;
  }

  /* ============================
     SPARKLES — explicit coords per the painting spec.
     menu.init places each star with --x / --y / --sz / --d / --delay
     so positions, sizes and twinkle phases are individually tuned;
     coordinates are PERCENTAGES of the 1366×1024 painting (same
     aspect as the 1448×1086 page, so the % translate cleanly).
     - .menu-star          : small round glow (dot-type sparkle)
     - .menu-star.is-cross : 4-point glyph star (the "✦" sparkle)
     The cross-stars use a brief flare-and-fade keyframe (mostly
     invisible, snaps bright for ~10% of the period) so they read
     as twinkles in a night sky rather than constant lit pixels.
     ============================ */
  .menu-star {
    position: absolute;
    left: var(--x); top: var(--y);
    width:  var(--sz);
    height: var(--sz);
    transform: translate(-50%, -50%);
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255,250,225,1) 0%,
      rgba(255,235,180,0.55) 50%,
      transparent 80%);
    box-shadow: 0 0 4px 1px rgba(255,235,180,0.45);
    opacity: 0.25;
    pointer-events: none;
    animation: menu-star-twinkle var(--d) ease-in-out infinite alternate;
    animation-delay: var(--delay);
    will-change: opacity, transform;
    z-index: 4;
  }
  @keyframes menu-star-twinkle {
    0%   { opacity: 0.18; transform: translate(-50%, -50%) scale(0.92); }
    100% { opacity: 0.78; transform: translate(-50%, -50%) scale(1.12); }
  }
  /* Cross-star uses the ✦ glyph as the visual. text-shadow doubles
     as the glow halo so we don't need a wrapping element. A second,
     much slower animation rotates the glyph (the `rotate:` CSS
     property is independent from `transform`, so it doesn't fight
     the twinkle keyframe's translate/scale). 60s per full turn ≈
     6°/s — visible as motion, not noticeable as rotation. */
  .menu-star.is-cross {
    width: auto; height: auto;
    background: none;
    border-radius: 0;
    box-shadow: none;
    font-size: var(--sz);
    line-height: 1;
    color: rgba(255,250,225,1);
    text-shadow:
      0 0 4px  rgba(255,235,180,0.95),
      0 0 10px rgba(255,225,170,0.55);
    animation:
      menu-cross-twinkle var(--d) ease-in-out infinite,
      menu-cross-spin    60s     linear      infinite;
    opacity: 0;
  }
  @keyframes menu-cross-twinkle {
    0%, 70%, 100% { opacity: 0;    transform: translate(-50%, -50%) scale(0.45); }
    78%           { opacity: 1;    transform: translate(-50%, -50%) scale(1.5);  }
    87%           { opacity: 0.55; transform: translate(-50%, -50%) scale(0.9);  }
  }
  @keyframes menu-cross-spin {
    from { rotate: 0deg;   }
    to   { rotate: 360deg; }
  }

  /* ============================
     SWAY OVERLAY LAYERS (the user explicitly OK'd distorting bg.)
     Each .menu-sway is a full-page copy of the painting (same
     bg-image / size: cover / position: 50% 50% so it pixel-aligns
     with the base bg underneath). A two-axis feathered mask
     restricts the visible portion to one region; the inline
     transform-origin + animation rotate/translate that region as a
     rigid body. Hard edges of the mask move WITH the content so
     the sway can't reveal a seam against the base.

     Per-instance mask-image / transform-origin / animation are
     set by menu.init from the SWAY_REGIONS array — coords are %
     of 1448×1086 (the painting's reference frame).
     ============================ */
  .menu-sway {
    position: absolute;
    inset: 0;
    background-image: url("assets/bg/ui/main-menu.jpg");
    background-size: cover;
    background-position: 50% 50%;
    pointer-events: none;
    z-index: 2;
    will-change: transform;
    /* clip-path is set inline per div by menu.init. We bailed on
       mask-image + mask-composite: intersect because Safari's
       handling of the multi-mask intersect composite is unreliable
       across iOS versions — when it failed, every sway overlay
       degenerated into a "full-width strip ∪ full-height strip"
       cross that covered most of the page, so transforms barely
       registered against the base. clip-path: inset(...) is rock
       solid in every Safari version that supports the property. */
  }

  /* ---- CONTINUOUS RIBBON wave (ONE polygon per ribbon, not 3
     slices). transform-origin is anchored at the root attachment
     so rotating around that pivot makes the tail swing in a wide
     arc while the root barely moves — the "root weak, tail
     strong" continuous deformation the user requested. */
  /* Ribbon swing AMPED — user said "怎么动都 ok 的 只要线不断".
     The polygon is one continuous shape so rotating it (even
     ±5°) doesn't break the cloth — just makes the tail swing
     dramatically while the root stays near the title attachment. */
  @keyframes ribbon-wave-l {
    0%   { transform: rotate(-4.5deg) translate(-4px, 2px); }
    50%  { transform: rotate( 1.2deg) translate( 0,    5px); }
    100% { transform: rotate( 5.0deg) translate( 5px, 6px); }
  }
  @keyframes ribbon-wave-r {
    0%   { transform: rotate( 4.5deg) translate( 4px, 2px); }
    50%  { transform: rotate(-1.2deg) translate( 0,    5px); }
    100% { transform: rotate(-5.0deg) translate(-5px, 6px); }
  }

  /* ---- HAIR ---- */
  @keyframes sway-hair-long {
    0%   { transform: translate(0,0)      rotate(-0.9deg); }
    100% { transform: translate(10px,3px) rotate( 1.6deg); }
  }
  @keyframes sway-hair-tips {
    0%   { transform: translate(0,0)       rotate(-1.6deg); }
    100% { transform: translate(15px,5px)  rotate( 2.4deg); }
  }
  @keyframes sway-hair-ear {
    0%   { transform: translate(0,0)     rotate(-0.4deg); }
    100% { transform: translate(5px,2px) rotate( 0.8deg); }
  }
  @keyframes sway-bow-tails {
    0%   { transform: translate(0,0)       rotate(-1.7deg); }
    100% { transform: translate(11px,4px)  rotate( 2.5deg); }
  }

  /* ---- BLUE banner-side tails ---- */
  @keyframes sway-blue-l {
    0%   { transform: translate(0,0)      rotate(-0.9deg); }
    100% { transform: translate(12px,3px) rotate( 2.4deg); }
  }
  @keyframes sway-blue-r {
    0%   { transform: translate(0,0)       rotate(-1.6deg); }
    100% { transform: translate(-10px,3px) rotate( 1.8deg); }
  }

  /* ---- TASSELS (pivot at top, big pendulum swing) ---- */
  @keyframes sway-tassel-l {
    0%   { transform: rotate(-3.0deg); }
    100% { transform: rotate( 3.0deg); }
  }
  @keyframes sway-tassel-r {
    0%   { transform: rotate( 2.8deg); }
    100% { transform: rotate(-2.8deg); }
  }

  /* ---- VERTICAL flower stalks (pivot at base) ---- */
  @keyframes sway-vert-l {
    0%   { transform: translate(0,0)    rotate(-1.8deg); }
    100% { transform: translate(4px,0)  rotate( 1.8deg); }
  }
  @keyframes sway-vert-r {
    0%   { transform: translate(0,0)    rotate( 2.0deg); }
    100% { transform: translate(-4px,0) rotate(-1.6deg); }
  }

  /* ---- BOTTOM-EDGE flower clusters (pivot at base) ---- */
  @keyframes sway-bot-l {
    0%   { transform: rotate(-1.6deg); }
    100% { transform: rotate( 2.0deg); }
  }
  @keyframes sway-bot-r {
    0%   { transform: rotate( 1.8deg); }
    100% { transform: rotate(-1.8deg); }
  }

  /* Magic-dust motes — 8 small luminous specks drifting slowly
     upward across the night sky. Pure translation, no displacement
     filter, no overlay copy of the painting → no risk of distorting
     the princess. Wallpaper-engine-style atmosphere: gives the menu
     a sense of "the air is moving" without touching any painted
     pixel. Each mote randomises x / drift / size / duration / delay
     so the layer never reads as synced. */
  .menu-dust {
    position: absolute;
    top: 0;
    left: var(--x);
    width: var(--sz);
    aspect-ratio: 1;
    border-radius: 50%;
    background: radial-gradient(circle,
      rgba(255, 245, 215, 0.92) 0%,
      rgba(255, 225, 170, 0.45) 45%,
      transparent 80%);
    box-shadow: 0 0 6px 1px rgba(255, 230, 180, 0.55);
    pointer-events: none;
    z-index: 4;
    opacity: 0;
    will-change: transform, opacity;
    animation: menu-dust-rise var(--d) linear infinite;
    animation-delay: var(--delay);
  }
  @keyframes menu-dust-rise {
    0%   { transform: translate(0, 105vh)                   scale(0.6); opacity: 0; }
    8%   { opacity: 0.78; }
    50%  { transform: translate(calc(var(--drift) * 0.6),  50vh)  scale(1);   opacity: 0.92; }
    92%  { opacity: 0.55; }
    100% { transform: translate(var(--drift),             -12vh)  scale(0.4); opacity: 0; }
  }

  /* WAND TIP GLOW — center (620, 419) of 1448×1086 → (42.82%, 38.58%).
     User said "成灯泡了" — was too bright at peak. Toned down:
     centre opacity capped at 0.85 (was 1.0), three box-shadow
     halos cut to 10/22/44 px spread with reduced intensity, breath
     peak now 0.78 not 1.0. Still large + visible, just no longer
     burning a hole through the painting. */
  .glow-wand {
    position: absolute;
    left: 42.82%; top: 38.58%;
    width: 2.4%; height: 2.8%;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    background: radial-gradient(circle,
      rgba(255, 252, 240, 0.85)  0%,
      rgba(255, 248, 220, 0.70) 16%,
      rgba(255, 232, 185, 0.42) 38%,
      rgba(255, 215, 145, 0.18) 62%,
      transparent              92%);
    box-shadow:
      0 0  10px  3px rgba(255, 240, 195, 0.55),
      0 0  22px  8px rgba(255, 225, 170, 0.30),
      0 0  44px 16px rgba(255, 210, 140, 0.12);
    mix-blend-mode: screen;
    z-index: 5;
    animation: glow-wand-breathe 3.4s ease-in-out infinite alternate;
  }
  @keyframes glow-wand-breathe {
    0%   { opacity: 0.32; transform: translate(-50%, -50%) scale(1);    filter: brightness(0.94); }
    100% { opacity: 0.78; transform: translate(-50%, -50%) scale(1.16); filter: brightness(1.06); }
  }

  /* ============================
     MENU BUTTON PRESS GLOW
     The user killed the separate ripple ::after — the position was
     off (clientX/Y vs button rect math was occasionally drifting
     during the breathing translateY) and "the button IS a
     component, just light it up". So now: pointerdown adds
     .is-clicking, which flashes the painted .menu-btn-inner with
     a brightness + warm drop-shadow glow on the button silhouette
     itself. No separate overlay element to misalign.
     ============================ */
  .menu-btn.is-clicking .menu-btn-inner {
    animation: menu-btn-glow 620ms ease-out;
  }
  @keyframes menu-btn-glow {
    0%   { filter: brightness(1)    saturate(1)    drop-shadow(0 0  0px rgba(255, 230, 170, 0)); }
    35%  { filter: brightness(1.32) saturate(1.18) drop-shadow(0 0 24px rgba(255, 240, 195, 0.92)); }
    70%  { filter: brightness(1.16) saturate(1.10) drop-shadow(0 0 16px rgba(255, 235, 180, 0.65)); }
    100% { filter: brightness(1)    saturate(1)    drop-shadow(0 0  0px rgba(255, 230, 170, 0)); }
  }

  /* ============================
     REDUCED MOTION
     Disable every cover-bg animation so motion-sensitive users see
     a still painting. Button feedback (ripple, press) is preserved
     since those are user-initiated, not idle.
     ============================ */
  @media (prefers-reduced-motion: reduce) {
    .menu-star, .glow-wand, .menu-btn-inner {
      animation: none !important;
    }
  }

  /* Global BGM control — top-right, no black pill bg per user.
     Just a thin parchment-gold track + small dot knob + a single
     chevron skip. Drops in front of the painting unobtrusively. */
  .global-bgm-control {
    position: fixed;
    top: env(safe-area-inset-top, 0px);
    right: 0;
    margin: 14px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0;
    background: transparent;
    border: 0;
    z-index: 1000;
  }
  .bgm-vol {
    -webkit-appearance: none;
    appearance: none;
    width: 96px;
    height: 14px;             /* tall enough to be a comfortable touch target */
    background: transparent;  /* track painted via ::before so we control width */
    outline: none;
    margin: 0;
    padding: 0;
    position: relative;
    cursor: pointer;
    pointer-events: auto;
    /* The slider works by handling pointer/touch on the input itself.
       We layer a custom thin track behind the native runnable track. */
    z-index: 1;
  }
  /* WebKit needs the track style on the runnable-track pseudo. */
  .bgm-vol::-webkit-slider-runnable-track {
    height: 1.5px;
    background: rgba(245, 225, 180, 0.55);
    border: 0;
    border-radius: 1px;
  }
  .bgm-vol::-moz-range-track {
    height: 1.5px;
    background: rgba(245, 225, 180, 0.55);
    border: 0;
    border-radius: 1px;
  }
  .bgm-vol::-webkit-slider-thumb {
    -webkit-appearance: none;
    appearance: none;
    width: 10px; height: 10px;
    background: rgba(245, 225, 180, 1);
    border-radius: 50%;
    border: 0;
    box-shadow: 0 0 4px rgba(0,0,0,0.55);
    cursor: pointer;
    margin-top: -4.25px;        /* re-centre thumb on the 1.5px track */
  }
  .bgm-vol::-moz-range-thumb {
    width: 10px; height: 10px;
    background: rgba(245, 225, 180, 1);
    border-radius: 50%;
    border: 0;
    box-shadow: 0 0 4px rgba(0,0,0,0.55);
    cursor: pointer;
  }
  .bgm-skip {
    background: transparent;
    border: 0;
    color: rgba(245, 225, 180, 0.92);
    font-size: 22px;
    line-height: 1;
    padding: 4px 6px;
    cursor: pointer;
    text-shadow: 0 1px 2px rgba(0,0,0,0.55);
  }
  .bgm-skip:active { color: rgba(255, 240, 200, 1); }
  body[data-current-view="splash"] .global-bgm-control { display: none; }

  /* Voices view — a simple scrollable list of installed system
     voices, each row testable + selectable. Painted on the same
     blank-page parchment background as save/load for cohesion. */
  .page.voices-art   { background-image: url("assets/bg/ui/page-blank.jpg"); }
  .voices-title {
    position: absolute; left: 28%; top: 5.5%;
    width: 44%; height: 6%;
    display: flex; align-items: center; justify-content: center;
    pointer-events: none;
    font-family: var(--font-display);
    font-size: 28px; letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--accent-wine, #6e2a2a);
    z-index: 5;
  }
  .voices-help {
    position: absolute; left: 16%; top: 12%;
    width: 68%;
    font-family: var(--font-text, serif);
    font-size: 14px; line-height: 1.5;
    color: rgba(75, 62, 42, 0.86);
    pointer-events: none;
    z-index: 5;
  }
  .voices-help em { font-style: italic; color: rgba(75, 62, 42, 1); }
  .voices-list {
    position: absolute; left: 16%; top: 24%;
    width: 68%; height: 61%;
    margin: 0; padding: 0 6px;
    list-style: none; overflow-y: auto; z-index: 4;
    /* master-frame is pointer-events:none so its children inherit
       none — without re-enabling here, the list could not be tapped
       OR scrolled (every touch went straight through to the page
       behind it). The flick-scrolling property gives iOS momentum
       scroll inside the scaled stage. */
    pointer-events: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
  }
  .voice-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    border-bottom: 1px solid rgba(184,158,111,0.35);
    font-family: var(--font-text, serif);
    color: rgba(75, 62, 42, 0.92);
  }
  .voice-row.is-current { background: rgba(244, 222, 170, 0.45); }
  .voice-name { font-size: 17px; }
  .voice-meta {
    font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase;
    color: rgba(126, 105, 74, 0.85);
  }
  .voice-row button {
    border: 1px solid rgba(126, 105, 74, 0.55);
    background: transparent;
    padding: 10px 16px;     /* bigger tap target */
    min-height: 36px;
    font-family: var(--font-display); font-size: 12px;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: rgba(75, 62, 42, 0.92);
    cursor: pointer;
  }
  .voice-row button:active { background: rgba(126, 105, 74, 0.18); }

  /* Save / Load title group — centred on the WHOLE book page (x 50%),
     NOT on reading's right-side 62.9% axis. The title band sits in the
     y 11.4%–18.0% guide range (page-relative, since save/load have no
     master-frame), clear of the slot grid that begins at y 18%. */
  .save-banner-title {
    position: absolute; left: 0; right: 0; width: 100%;
    top: 9%; height: 9.5%;
    margin: 0;
    display: flex; align-items: center; justify-content: center; gap: 0.46em;
    text-align: center;
    pointer-events: none;
    font-family: var(--font-display);
    font-size: clamp(34px, 5.2vw, 58px);
    font-weight: 600; letter-spacing: 0.14em; line-height: 1;
    text-transform: uppercase;
    text-shadow: 0 1px 0 rgba(255, 250, 238, 0.6), 0 3px 9px rgba(60, 44, 24, 0.26);
    z-index: 5;
  }
  /* engraved flourishes flanking the word — turns "content text" into a title */
  .save-banner-title::before,
  .save-banner-title::after {
    content: "❧"; font-size: 0.5em; line-height: 1;
    color: var(--color-gold-soft); opacity: 0.78; transform: translateY(-0.12em);
  }
  .save-banner-title::after { transform: scaleX(-1) translateY(-0.12em); }
  .theme-save .save-banner-title { color: var(--accent-wine); }
  .theme-load .save-banner-title { color: var(--accent-blue); }
  .save-slot-grid {
    position: absolute; left: 16%; top: 18%;
    width: 68%; height: 67%;
    display: grid; grid-template-columns: repeat(2, 1fr);
    grid-auto-rows: 1fr; gap: 18px 28px; z-index: 4;
  }
</style>
</head>
<body>

<div class="stage" id="stage"></div>

<!-- Global BGM control — small chip top-right that's visible on
     every view except splash (where it would compete with the
     full-screen tap target). Holds a volume slider + a "next
     track" skip button so the player can break out of the
     per-view default music when one track wears thin. The voice
     picker is still reachable from the #voices URL; the link
     was removed since system TTS volume is OS-controlled. -->
<div class="global-bgm-control" aria-label="Music control">
  <input class="bgm-vol" type="range" min="0" max="100" value="32"
         aria-label="Music volume" />
  <button type="button" class="bgm-skip" aria-label="Next track">›</button>
</div>


<template id="view-splash">
  <main class="page splash">
    <div class="splash-hit" aria-label="Tap to begin"></div>
  </main>
</template>

<template id="view-menu">
  <main class="page art-bg home" data-page="menu">
    <!-- ==================== Cover BG animation layer ====================
         z-index 1, pointer-events: none. Holds every per-region overlay
         that animates the painted scene (curtains, banners, flowers,
         vines, water, stars, wand). The painted face / hands / castle /
         title scroll have NO overlay on top — they stay perfectly still.
         Coords + mask regions are tuned to the 1400×1050 source PNG.   -->
    <div class="cover-bg-layer" aria-hidden="true">
      <!-- Wand-tip glow at (645, 474) of the 1366×1024 painting. The
           single additive radial breath. Everything else is dots. -->
      <div class="menu-glow glow-wand"></div>
      <!-- All sparkles (night-sky dots + cross-stars, moon halo dots,
           wand-side dots + crosses, lake glints) are appended here by
           menu.init at the exact px coords spec'd in the painting. -->
    </div>
    <!-- ==================== Cover UI / interaction layer ===================
         z-index 10, pointer-events: auto. Buttons live here; the bg layer
         above this comment cannot block their taps.

         Each button now has a small overlay stack on top of the painted
         .menu-btn-inner:
           - .menu-btn-badge  → top-centre gold blessing pulse on click
           - .menu-btn ::before → LEFT  = diagonal gleam sweep
                                  RIGHT = box-shadow unlock pulse
           - .menu-btn ::after  → tap-point gold ripple                 -->
    <div class="cover-ui-layer">
      <button type="button" class="menu-btn left"  data-action="resume">
        <span class="menu-btn-inner"></span>
        <span class="menu-btn-badge" aria-hidden="true"></span>
      </button>
      <button type="button" class="menu-btn right" data-action="enter-chapters">
        <span class="menu-btn-inner"></span>
        <span class="menu-btn-badge" aria-hidden="true"></span>
      </button>
      <!-- Two painted plaque entries at the foot of the cover:
           Begin Trial → continue the main trial; Words Recall → review. -->
      <button type="button" class="menu-btn quiz" data-action="quiz">
        <span class="menu-btn-inner"></span>
        <span class="menu-btn-badge" aria-hidden="true"></span>
      </button>
      <button type="button" class="menu-btn recall" data-action="recall">
        <span class="menu-btn-inner"></span>
        <span class="menu-btn-badge" aria-hidden="true"></span>
      </button>
      <!-- Follow Paths → the visual-novel relay station (#paths). -->
      <button type="button" class="menu-btn paths" data-action="paths">
        <span class="menu-btn-inner"></span>
        <span class="menu-btn-badge" aria-hidden="true"></span>
      </button>
    </div>
  </main>
</template>

<template id="view-select">
  <main class="page art-bg select-art" data-page="select">
    <div class="master-frame">
      <div class="ui-zone zone-select-story-title is-text select-title-text" data-zone="story title">
        <h2 class="select-card-title">Story</h2>

              data-go="#notes" aria-label="Notes"></button>

        <button type="button" data-go="#load"><span class="nav-glyph">❧</span>Load</button>

<template id="view-reading">
  <main class="page art-bg reading-art" data-page="reading">
    <div class="master-frame">
      <div class="ui-zone zone-reading-title is-text" data-zone="reading title">
        <div class="reading-titleline">
          <span class="reading-kicker" data-chapter-number>Chapter 01</span>

        <h2 class="reading-subtitle" data-chapter-section>1.1 · The First Light</h2>
      </div>
      <!-- Top-right control group: one slim classical tool bar holding
           the BGM volume (thin gold line + small gilt dot) and the AUTO
           read toggle. -->
      <div class="ui-zone zone-reading-controls" data-zone="controls">
        <div class="reading-controls">
          <span class="rc-note" aria-hidden="true">♪</span>
          <input class="rc-vol reading-bgm-vol" type="range" min="0" max="100" value="55"
                 aria-label="Music volume">
          <button type="button" class="rc-auto" data-auto aria-label="Auto read">
            <span class="auto-label">Auto</span>
          </button>
        </div>
      </div>
      <div class="ui-zone zone-reading-body is-text" data-zone="reading body">
        <article class="reading-body"></article>
      </div>
      <div class="ui-zone zone-marginalia" data-zone="marginalia">
        <aside class="marginalia-card">
          <div class="marginalia-card-body">
            <div class="word-card-stack">
              <div class="word-card-empty">Tap a word</div>
            </div>
          </div>
          <div class="marginalia-card-actions">
            <button type="button" class="marginalia-btn" data-action="fold" disabled>
              <span class="marginalia-btn-glyph">✤</span>FOLD
            </button>
            <!-- Locket — runs the persistent count of folded words.
                 Pops on every successful FOLD so the reader sees the
                 number grow. -->
            <div class="marginalia-locket" aria-label="Folded words">
              <span class="marginalia-locket-glyph">❦</span>
              <span class="marginalia-locket-count" data-saved-count>0</span>
            </div>
          </div>
        </aside>
      </div>
      <!-- STORY (linear) reading bar — 5 cells, unchanged. Browse mode
           (entered from the index) rebuilds this to Prev · Back · Next
           in Views.reading.init. -->
      <nav class="ui-bottom-nav is-three">
        <button type="button" data-go="#notes?from=reading"><span class="nav-glyph">❧</span>Notes</button>
        <button type="button" data-next>Next<span class="nav-glyph-after">›</span></button>
        <button type="button" data-go="#menu"><span class="nav-glyph">✤</span>Menu</button>
      </nav>
    </div>
  </main>
</template>

<template id="view-quiz">
  <main class="page art-bg reading-art" data-page="quiz">

<template id="view-paths">
  <!-- The "Follow" relay station: the painted PATHS frame (columns + curtains),
       with three coordinate-locked frames measured on the 1448×1086 art:
         · top label slot    → the word "Follow"
         · centre list slot   → five protagonist portraits in one column
         · foot UI slot       → Save · Load · Menu -->
  <main class="page art-bg follow-art" data-page="paths">
    <div class="follow-frame">
      <!-- Top slot (the original label frame): Restart · Follow, each half, no divider. -->
      <nav class="follow-top">

<template id="view-vn">
  <!-- 文游 visual-novel reader — reuses the reading shell (.reading-art zones)
       so layout matches the study reader; the background is the chapter
       protagonist's 立绘, set per chapter in Views.vn. -->
  <main class="page art-bg reading-art vn-art" data-page="vn">
    <div class="master-frame">
      <div class="ui-zone zone-reading-title is-text" data-zone="reading title">
        <div class="reading-titleline">
          <span class="reading-kicker vn-chap-n">Chapter 01</span>
          <h1 class="reading-title vn-chap-t">The Glass Elevator</h1>
        </div>
        <div class="antique-divider"><span class="antique-divider-glyph">✤</span></div>
      </div>
      <div class="ui-zone zone-reading-body is-text" data-zone="reading body">
        <article class="reading-body vn-flow" aria-live="polite"></article>
      </div>
      <!-- Volume + Auto, same control group as reading. -->
      <div class="ui-zone zone-reading-controls" data-zone="controls">

            </div>
