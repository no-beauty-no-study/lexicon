<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notes · The Princess Lexicon</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/layout.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/pages.css">
<style>
  .page.notes-art {
    background-image: url("assets/bg/ui/notes.jpg");
    background-size: cover;
    background-position: center;
  }
  .page.notes-art::before, .page.notes-art::after { display: none; }
  /* Push the interactive layer into the empty centre of the artwork. */
  .notes-layer {
    position: absolute;
    inset: 18% 18% 14% 18%;
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 24px;
  }
  .notes-layer .split-left,
  .notes-layer .split-right {
    background: rgba(244, 236, 218, 0.62);
    border: 1px solid rgba(184, 158, 111, 0.45);
    border-radius: 4px;
    padding: 14px 14px 10px;
    min-height: 0;
    display: flex;
    flex-direction: column;
  }
  .notes-layer .split-right { padding: 18px 22px; overflow-y: auto; }
  .notes-layer .word-list { flex: 1; overflow-y: auto; }
</style>
</head>
<body>
<div class="stage">
  <main class="page notes-art">
    <div class="notes-layer">
      <div class="split-left">
        <div class="split-header">
          <span class="sh-title" style="font-size:18px;">Saved Words</span>
          <span class="sh-count" data-notes-count>0 saved</span>
        </div>
        <ul class="word-list"></ul>
      </div>
      <div class="split-right">
        <div class="detail-pane ornate-panel"></div>
      </div>
    </div>

    <nav class="nav-bar">
      <button type="button" class="nav-btn" onclick="go('select.html')">
        <span class="glyph">‹</span> Back
      </button>
      <span class="nav-sep"></span>
      <button type="button" class="nav-btn" onclick="go('index.html')">
        <span class="glyph">✦</span> Menu
      </button>
    </nav>
  </main>
</div>

<script src="data/mockWords.js"></script>
<script src="js/app.js"></script>
<script src="js/storage.js"></script>
<script src="js/wordCard.js"></script>
<script src="js/notes.js"></script>
</body>
</html>
